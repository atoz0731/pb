<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Todo</title>
<link rel="manifest" href="todo-manifest.json">
<style>
*{box-sizing:border-box}:root{--todo-accent:#1f4f8f;--todo-border:#d7d7d7;--todo-surface:#fff;--todo-soft:#eaf2ff}
html,body{margin:0;min-height:100%;background:#f3f4f6;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
button,input,textarea,select{font:inherit}.hidden{display:none!important}
#screen{min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.shell{width:100%;max-width:760px;min-height:100dvh;margin:0 auto;background:#f7f7f8;display:flex;flex-direction:column}
.appTitle{position:relative;height:48px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff;border-bottom:1px solid #ddd;font-size:16px;font-weight:800}.homeBtn{position:absolute;right:10px;top:7px;width:34px;height:34px;border:0;background:transparent;color:#444;font-size:21px}
.login{padding:16px;background:#fff}.login input{width:100%;border:1px solid #ccc;border-radius:10px;padding:11px;margin:5px 0;font-size:16px}
.loginBtn{width:100%;border:0;border-radius:10px;padding:11px;background:#111;color:#fff;font-weight:700;margin-top:8px}.hint{text-align:center;color:#888;font-size:10px;margin-top:8px}
#todoBox{min-height:0;flex:1;display:flex;flex-direction:column}
.toolbar{position:relative;flex:0 0 auto;padding:7px 9px;background:#fff;border-bottom:1px solid #e4e4e4}.toolbarTop{display:flex;align-items:center;justify-content:flex-end;gap:5px}
.completeBtn{border:1px solid var(--todo-border);border-radius:999px;background:#fff;color:var(--todo-accent);font-size:10px;font-weight:700;padding:6px 10px}.completeBtn.active{background:var(--todo-accent);border-color:var(--todo-accent);color:#fff}
.addBtn{border:1px solid var(--todo-accent);border-radius:999px;background:var(--todo-accent);color:#fff;font-size:11px;font-weight:700;padding:7px 11px;white-space:nowrap}.iconBtn{display:grid;place-items:center;width:32px;height:32px;flex:0 0 32px;border:1px solid var(--todo-border);border-radius:50%;background:#fff;color:var(--todo-accent);font-size:16px;padding:0}.iconBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.iconBtn.active{background:var(--todo-soft);border-color:var(--todo-accent)}
.toolMenu{position:absolute;right:76px;top:43px;z-index:90;min-width:160px;background:#fff;border:1px solid var(--todo-border);border-radius:12px;box-shadow:0 5px 18px rgba(0,0,0,.16);overflow:hidden}.toolMenu button{display:block;width:100%;border:0;border-bottom:1px solid #eee;background:#fff;color:#222;text-align:left;padding:10px 12px;font-size:11px}.toolMenu button:last-child{border-bottom:0}.toolMenu button.active{font-weight:800;background:#eef3f9;color:var(--todo-accent)}
#todoList{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:7px 9px 24px}
.monthLabel{font-size:12px;font-weight:800;color:#666;margin:8px 2px 5px}
.empty{text-align:center;color:#999;font-size:12px;padding:34px 10px}
.todoCard{background:#fff;border-radius:11px;border:1px solid #e4e4e4;border-left:4px solid #2f6fed;padding:7px 8px 6px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.025)}
.todoCard.due-today{background:#fff7e8}.todoCard.due-overdue{background:#fff0f0}
.todoCard.completed{opacity:.82}.todoHead{display:flex;align-items:flex-start;gap:7px}.todoCheck{width:19px!important;height:19px!important;flex:0 0 auto;margin:1px 0 0}
.todoMain{flex:1;min-width:0}.todoTitle{font-size:13px;font-weight:800;line-height:1.25;word-break:break-word}.todoCard.completed .todoTitle{text-decoration:line-through;color:#777}
.todoInfoRow{display:flex;align-items:center;gap:6px;min-width:0;margin-top:4px}.todoCategory{flex:0 0 auto;border-radius:999px;background:#e9edf4;color:#4e5968;font-size:9px;font-weight:700;padding:2px 6px}
.todoCategory.category-work{background:#dfeeff;color:#245d9c}.todoCategory.category-home{background:#fff0cf;color:#945c00}.todoCategory.category-other{background:#ddf3e4;color:#297044}
.todoDates{display:flex;flex:1;min-width:0;flex-wrap:wrap;gap:2px 8px;font-size:9px;line-height:1.35;color:#777}.todoDates .late{color:#d13b3b;font-weight:800}
.todoProgress{flex:0 0 auto;border-radius:999px;background:#eef3ff;color:#2f6fed;font-size:9px;font-weight:800;padding:2px 6px}
.todoPrivacyIcon{flex:0 0 auto;font-size:12px;line-height:1}
.todoDetails{white-space:pre-wrap;word-break:break-word;font-size:10px;line-height:1.35;color:#555;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.todoNearestItem{display:flex;align-items:center;gap:5px;margin-top:5px;padding:5px 7px;border-radius:8px;background:#f5f7fb;color:#46546a;font-size:10px;line-height:1.3}.todoNearestItem .label{flex:0 0 auto;font-weight:800;color:#36547f}.todoNearestItem .text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.todoNearestItem .due{flex:0 0 auto;font-weight:800}.todoNearestItem.overdue .due{color:#c33}
.todoCard.multiExpandable{cursor:pointer}.todoSubtasks{margin:7px 0 1px 26px;padding-top:6px;border-top:1px solid #eee}.todoSubtaskRow{display:flex;align-items:flex-start;gap:7px;padding:5px 0;font-size:11px;line-height:1.35}.todoSubtaskRow input{width:18px!important;height:18px!important;flex:0 0 auto;margin:0}.todoSubtaskContent{min-width:0;flex:1}.todoSubtaskText{display:block}.todoSubtaskDue{display:block;margin-top:2px;color:#68758a;font-size:9px;font-weight:700}.todoSubtaskDue.overdue{color:#c33}.todoSubtaskRow.done .todoSubtaskText{text-decoration:line-through;color:#888}.todoSubtaskRow.done .todoSubtaskDue{color:#999}
.todoMenu{flex:0 0 auto;position:relative;margin-left:1px}.todoMenuBtn{border:0;background:none;color:#777;font-size:17px;line-height:1;padding:1px 2px 5px}
.todoMenuPopup{position:absolute;right:0;top:20px;z-index:65;background:#fff;border:1px solid #ddd;border-radius:9px;box-shadow:0 4px 15px #0002;min-width:82px;overflow:hidden}
.todoMenuPopup button{display:block;width:100%;border:0;background:#fff;color:#555;text-align:left;font-size:11px;padding:8px 10px}.todoMenuPopup .danger{color:#c33}
.todoNextAction{display:block;width:calc(100% - 26px);margin:7px 0 1px 26px;border:1px solid #9aa9c4;border-radius:9px;background:#f4f7fc;color:#36547f;font-size:10px;font-weight:800;padding:7px 10px;text-align:center}.todoNextStatus{font-size:8px;color:#71809a;margin-top:3px}
.modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding-top:env(safe-area-inset-top)}
.modal{width:calc(100vw - 24px);max-width:520px;background:#fff;border-radius:20px 20px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom));max-height:calc(100dvh - env(safe-area-inset-top) - 10px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.modal h3{margin:0 0 12px}.formLabel{display:block;font-size:11px;color:#777;margin:9px 0 4px}
.modal input,.modal textarea,.modal select{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:10px;margin:5px 0}.modal textarea{resize:none;min-height:100px}
.modal input[type="date"]{height:56px;min-height:56px;line-height:56px;padding:0 16px;margin:0;border-radius:14px;background:#f3f3f3;-webkit-appearance:none;appearance:none;text-align:center;font-size:18px}
.modal input[type="date"]::-webkit-date-and-time-value{min-width:0;min-height:56px;line-height:56px;text-align:center}
.modal .itemDue{height:38px!important;min-height:38px!important;line-height:38px!important;padding:0 8px!important;border-radius:9px!important;background:#fff!important;font-size:13px!important;text-align:left!important}.modal .itemDue::-webkit-date-and-time-value{min-height:38px!important;line-height:38px!important;text-align:left!important}
.multiToggle{display:block;width:100%;border:1px solid #ccc;border-radius:10px;background:#fff;color:#555;font-size:12px;font-weight:800;padding:10px;margin-top:8px}.multiToggle.active{background:#111;border-color:#111;color:#fff}
.itemsEditor{margin-top:8px;padding:8px;border-radius:10px;background:#f4f4f5}.itemComposer,.editItemRow{display:flex;align-items:center;gap:5px}.itemComposer input{margin:0!important;min-width:0}.itemComposer button{flex:0 0 auto;border:0;border-radius:9px;background:#111;color:#fff;font-weight:700;padding:10px 11px;white-space:nowrap}.editItemRow{margin-top:8px}.itemFields{flex:1;min-width:0}.itemFields input{margin:0!important;min-width:0}.itemDueLabel{display:flex;align-items:center;gap:5px;margin-top:4px;color:#777;font-size:9px}.itemDueLabel span{flex:0 0 auto}.itemOrder{display:flex;flex:0 0 auto;gap:3px}.editItemRow button{flex:0 0 auto;width:30px;height:32px;border:0;border-radius:9px;background:#e4e4e7;color:#555;font-weight:800;padding:0}.editItemRow button:disabled{opacity:.3}.editItemRow .itemRemove{border-radius:50%;color:#777}
.weekday{font-size:10px;color:#777;text-align:right;margin-top:3px;min-height:14px}.modalBtns{display:flex;gap:8px;margin-top:12px}.modalBtns button{flex:1;border:0;border-radius:10px;min-height:44px}.saveBtn{background:#111;color:#fff;font-weight:700}.completeBtns{flex-wrap:wrap}.completeBtns #saveCompletePending{flex-basis:100%;order:3}
.reminderList{max-height:52vh;overflow:auto;margin:8px 0 12px}.reminderItem{border-left:4px solid #d13b3b;background:#fff4f3;border-radius:9px;padding:9px 10px;margin-bottom:7px}.reminderItem.today{border-left-color:#2f6fed;background:#f1f6ff}.reminderSection{font-size:11px;font-weight:800;color:#666;margin:10px 2px 6px}.reminderTitle{font-size:13px;font-weight:800}.reminderMeta{font-size:10px;color:#a33;margin-top:3px}.reminderItem.today .reminderMeta{color:#365f9c}
.reportNav{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 5px}.reportNav button{width:36px;height:34px;border:1px solid var(--todo-border);border-radius:50%;background:#fff;color:var(--todo-accent);font-size:20px}.reportMonth{min-width:128px;text-align:center;font-size:15px;font-weight:800}.reportCaption{text-align:center;color:#777;font-size:10px;margin-bottom:10px}.reportBody{border:1px solid var(--todo-border);border-radius:12px;background:#f5f7fa;padding:12px;white-space:pre-wrap;font-size:13px;line-height:1.75;min-height:170px}.reportCopy{background:var(--todo-accent)!important;color:#fff!important;font-weight:700}
</style>
</head>
<body>
<div id="screen"><main class="shell">
  <div class="appTitle">Todo<button id="personalHome" class="homeBtn" type="button" aria-label="個人ページへ戻る" title="個人ページへ戻る">⌂</button></div>
  <section id="loginBox" class="login hidden">
    <input id="loginId" autocomplete="username" placeholder="ID">
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="パスワード">
    <button id="loginButton" class="loginBtn" type="button">開く</button>
    <div id="loginError" class="hint"></div>
  </section>
  <section id="todoBox" class="hidden">
    <div class="toolbar">
      <div class="toolbarTop">
        <button id="reportButton" class="iconBtn" type="button" aria-label="仕事Todoレポート" title="仕事Todoレポート">📒</button>
        <button id="categoryButton" class="iconBtn" type="button" aria-label="カテゴリで絞り込み" title="カテゴリで絞り込み"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button>
        <button id="sortButton" class="iconBtn" type="button" aria-label="並び替え" title="並び替え">⇅</button>
        <button id="completeButton" class="completeBtn" type="button">完了</button>
        <button id="addButton" class="addBtn" type="button">＋ 作成</button>
      </div>
      <div id="categoryMenu" class="toolMenu hidden"><button type="button" data-category="all">すべてのカテゴリ</button><button type="button" data-category="work">仕事</button><button type="button" data-category="home">家のこと</button><button type="button" data-category="other">その他</button></div>
      <div id="sortMenu" class="toolMenu hidden"><button type="button" data-sort="new">新しい順</button><button type="button" data-sort="due">目標日順</button></div>
    </div>
    <div id="todoList"></div>
  </section>
</main></div>

<div id="editModal" class="modalOverlay hidden"><div class="modal">
  <h3 id="editModalTitle">Todoを追加</h3>
  <label class="formLabel" for="titleInput">件名</label><input id="titleInput" placeholder="やること">
  <button id="multiToggle" class="multiToggle" type="button" aria-pressed="false">複数項目 OFF</button>
  <div id="itemsEditor" class="itemsEditor hidden"><div class="itemComposer"><input id="itemInput" placeholder="項目を入力"><button id="addItem" type="button">＋ 追加</button></div><div id="itemEditorList"></div></div>
  <label class="formLabel" for="initialDueInput">初期目標終了日</label><input id="initialDueInput" type="date"><div id="initialWeekday" class="weekday"></div>
  <label class="formLabel" for="revisedDueInput">改訂目標終了日（任意）</label><input id="revisedDueInput" type="date"><div id="revisedWeekday" class="weekday"></div>
  <label class="formLabel" for="categoryInput">カテゴリ</label><select id="categoryInput"><option value="work">仕事</option><option value="home">家のこと</option><option value="other">その他</option></select>
  <label class="formLabel" for="detailsInput">詳細</label><textarea id="detailsInput" placeholder="メモ（任意）"></textarea>
  <label style="display:flex;align-items:center;justify-content:space-between;padding:9px 2px">完了時に次回予定を登録<input id="repeatNextInput" type="checkbox" style="width:22px!important;height:22px!important;margin:0"></label>
  <div class="modalBtns"><button id="cancelEdit" type="button">キャンセル</button><button id="saveEdit" class="saveBtn" type="button">保存</button></div>
</div></div>

<div id="completeModal" class="modalOverlay hidden"><div class="modal">
  <h3>完了日を入力</h3><div id="completeTitle" class="hint"></div>
  <label class="formLabel" for="completedDateInput">完了日</label><input id="completedDateInput" type="date">
  <div id="nextDueFields" class="hidden"><label class="formLabel" for="nextDueInput">次回予定日</label><input id="nextDueInput" type="date"><div id="nextDueWeekday" class="weekday"></div><div class="hint">未定の場合は「次回未定で完了」を選べます。</div></div>
  <div class="modalBtns completeBtns"><button id="cancelComplete" type="button">キャンセル</button><button id="saveCompletePending" type="button" class="hidden">次回未定で完了</button><button id="saveComplete" class="saveBtn" type="button">完了にする</button></div>
</div></div>

<div id="nextModal" class="modalOverlay hidden"><div class="modal">
  <h3>次回Todoを登録</h3><div id="nextTitle" class="hint"></div>
  <label class="formLabel" for="laterNextDueInput">次回予定日</label><input id="laterNextDueInput" type="date"><div id="laterNextDueWeekday" class="weekday"></div>
  <div class="modalBtns"><button id="cancelNext" type="button">キャンセル</button><button id="saveNext" class="saveBtn" type="button">登録する</button></div>
</div></div>

<div id="reminderModal" class="modalOverlay hidden"><div class="modal">
  <h3>今日のTodo・期限のお知らせ</h3><div class="hint">今日が目標日のTodoと、期限を過ぎた未完了Todoを確認できます。</div><div id="reminderList" class="reminderList"></div>
  <div class="modalBtns"><button id="closeReminder" class="saveBtn" type="button">閉じる</button></div>
</div></div>

<div id="reportModal" class="modalOverlay hidden"><div class="modal">
  <h3>仕事Todoレポート</h3>
  <div class="reportNav"><button id="reportPrev" type="button" aria-label="前月">‹</button><div id="reportMonth" class="reportMonth"></div><button id="reportNext" type="button" aria-label="次月">›</button></div>
  <div class="reportCaption">カテゴリ：仕事</div><div id="reportBody" class="reportBody"></div>
  <div class="modalBtns"><button id="closeReport" type="button">閉じる</button><button id="copyReport" class="reportCopy" type="button">コピー</button></div>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

const firebaseConfig={apiKey:"AIzaSyBYEhnK2xJPYW457kgCme2KQJJEtJlowgk",authDomain:"message-57e2d.firebaseapp.com",projectId:"message-57e2d",storageBucket:"message-57e2d.firebasestorage.app",messagingSenderId:"560072908841",appId:"1:560072908841:web:a6d0e92a57a24c152a3c38"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
$('personalHome').onclick=()=>{location.href=new URL('personal.html',location.href).toString()};
const CATEGORIES={work:"仕事",home:"家のこと",other:"その他"};
const CATEGORY_ORDER={work:0,home:1,other:2};
let currentUID="",currentId="",todos=[],unsub=null,showCompleted=false,category="all",sortMode=localStorage.getItem("pb.todoStandaloneSort")||"new",editing=null,completing=null,completingItems=null,registeringNext=null,multiMode=false,editingItems=[],expandedIds=new Set(),reminderShownDate="",reportMonthId="";

function todayId(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function asDate(v){if(!v)return null;const d=new Date(`${v}T00:00:00`);return Number.isNaN(d.getTime())?null:d}
function dateLabel(v){const d=asDate(v);return d?d.toLocaleDateString("ja-JP",{year:"numeric",month:"numeric",day:"numeric",weekday:"short"}):"－"}
function shortDateLabel(v){const d=asDate(v);return d?d.toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"}):"期限なし"}
function itemsInDueOrder(items){return (Array.isArray(items)?items:[]).map((item,sourceIndex)=>({item,sourceIndex})).sort((a,b)=>(Number(!!a.item.done)-Number(!!b.item.done))||String(a.item.dueDate||"9999").localeCompare(String(b.item.dueDate||"9999"))||a.sourceIndex-b.sourceIndex)}
function nearestItem(items){const undone=(Array.isArray(items)?items:[]).map((item,index)=>({item,index})).filter(x=>!x.item.done);if(!undone.length)return null;const dated=undone.filter(x=>x.item.dueDate).sort((a,b)=>String(a.item.dueDate).localeCompare(String(b.item.dueDate))||a.index-b.index);return (dated[0]||undone[0]).item}
function shiftedItemDue(value,sourceDue,targetDue){const itemDate=asDate(value),from=asDate(sourceDue),to=asDate(targetDue);if(!itemDate||!from||!to)return value||"";itemDate.setDate(itemDate.getDate()+Math.round((to-from)/86400000));return `${itemDate.getFullYear()}-${String(itemDate.getMonth()+1).padStart(2,"0")}-${String(itemDate.getDate()).padStart(2,"0")}`}

function updateWeekdays(){const a=asDate($("initialDueInput").value),b=asDate($("revisedDueInput").value);$("initialWeekday").textContent=a?a.toLocaleDateString("ja-JP",{weekday:"long"}):"";$("revisedWeekday").textContent=b?b.toLocaleDateString("ja-JP",{weekday:"long"}):""}
function visibleTodos(){const rows=todos.filter(t=>t.category!=="two").filter(t=>!!t.completed===showCompleted).filter(t=>category==="all"||t.category===category);rows.sort((a,b)=>{if(showCompleted)return String(b.completedDate||"").localeCompare(String(a.completedDate||""))||millis(b,"completedAt")-millis(a,"completedAt");if(sortMode==="due"){const byDate=String(effectiveSortDue(a)).localeCompare(String(effectiveSortDue(b)));if(byDate)return byDate;return (CATEGORY_ORDER[a.category]??99)-(CATEGORY_ORDER[b.category]??99)||millis(b)-millis(a)}return millis(b)-millis(a)});return rows}

function render(){
  $("completeButton").classList.toggle("active",showCompleted);$("completeButton").textContent=showCompleted?"未完了":"完了";$("categoryButton").classList.toggle("active",category!=="all");$("categoryButton").title=`カテゴリ：${category==="all"?"すべて":CATEGORIES[category]||"すべて"}`;$("sortButton").title=sortMode==="due"?"並び替え：目標日順":"並び替え：新しい順";document.querySelectorAll("#categoryMenu [data-category]").forEach(b=>b.classList.toggle("active",b.dataset.category===category));document.querySelectorAll("#sortMenu [data-sort]").forEach(b=>b.classList.toggle("active",b.dataset.sort===sortMode));
  const box=$("todoList");box.innerHTML="";const rows=visibleTodos();if(!rows.length){box.innerHTML=`<div class="empty">${showCompleted?"該当する完了Todoはありません。":"Todoはありません。"}</div>`;return}
  let lastMonth="";
  rows.forEach(t=>{
    if(showCompleted&&t.completedDate){const month=t.completedDate.slice(0,7);if(month!==lastMonth){lastMonth=month;const h=document.createElement("div");h.className="monthLabel";const [y,m]=month.split("-");h.textContent=`${y}年${Number(m)}月`;box.appendChild(h)}}
    const items=Array.isArray(t.items)?t.items:[],isMulti=items.length>0,doneCount=items.filter(x=>x.done).length;
    const effectiveDue=t.completed?"":effectiveSortDue(t),dueClass=effectiveDue&&effectiveDue!=="9999"?(effectiveDue<todayId()?"due-overdue":effectiveDue===todayId()?"due-today":""):"";const card=document.createElement("div");card.className=`todoCard ${t.completed?"completed":""} ${dueClass} ${isMulti?"multiExpandable":""}`;

function itemId(){return globalThis.crypto?.randomUUID?.()||`item-${Date.now()}-${Math.random().toString(36).slice(2)}`}

function openComplete(t,pendingItems=null){completing=t;completingItems=pendingItems?pendingItems.map(x=>({...x})):null;$("completeTitle").textContent=t.title||"無題";$("completedDateInput").value=todayId();const needsNext=!!t.repeatNext&&!t.nextTodoCreated;$("nextDueFields").classList.toggle("hidden",!needsNext);$("saveCompletePending").classList.toggle("hidden",!needsNext);$("nextDueInput").value="";$("nextDueInput").min=$("completedDateInput").value;$("nextDueWeekday").textContent="";$("saveComplete").textContent=needsNext?"次回Todoも作成":"完了にする";$("completeModal").classList.remove("hidden");render()}

function nextPayload(t,dueDate){const sourceDue=t.revisedDueDate||t.initialDueDate,items=(Array.isArray(t.items)?t.items:[]).map(x=>({id:itemId(),text:String(x.text||""),done:false,dueDate:shiftedItemDue(x.dueDate,sourceDue,dueDate)}));return {title:t.title||"",initialDueDate:dueDate,revisedDueDate:null,category:t.category||"other",details:t.details||"",privateOnly:!!t.privateOnly,shared:!!t.shared,multiItem:items.length>0,items,repeatNext:!!t.repeatNext,uid:t.uid,senderId:t.senderId||currentId,completed:false,completedDate:null,completedAt:null,completedBy:null,nextTodoPending:false,nextTodoCreated:false,nextTodoId:null,nextDueDate:null,previousTodoId:t.id,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),updatedBy:currentId}}

function shiftReportMonth(delta){const [year,month]=(reportMonthId||todayId().slice(0,7)).split("-").map(Number),d=new Date(year,month-1+delta,1);reportMonthId=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;renderReport()}

function renderReport(){const month=reportMonthId||todayId().slice(0,7),[year,monthNo]=month.split("-");$("reportMonth").textContent=`${year}年${Number(monthNo)}月`;$("reportBody").textContent=reportText()}

function showReminders(){const today=todayId(),eligible=todos.filter(t=>t.category!=="two"&&!t.completed),reminderRows=eligible.map(t=>{const nextItem=nearestItem(t.items);return {t,nextItem,dueDate:nextItem?.dueDate||t.revisedDueDate||t.initialDueDate||""}}),dueToday=reminderRows.filter(row=>row.dueDate===today),overdue=reminderRows.filter(row=>row.dueDate&&row.dueDate<today);if(!dueToday.length&&!overdue.length)return;const box=$("reminderList");box.innerHTML="";const appendSection=(label,rows,isToday)=>{if(!rows.length)return;const section=document.createElement("div");section.className="reminderSection";section.textContent=label;box.appendChild(section);rows.forEach(({t,nextItem,dueDate})=>{const item=document.createElement("div");item.className=`reminderItem ${isToday?"today":""}`;const title=document.createElement("div");title.className="reminderTitle";title.textContent=t.title||"無題";const meta=document.createElement("div");meta.className="reminderMeta";const nextLabel=nextItem?`・次：${nextItem.text||"未入力の項目"}`:"";meta.textContent=isToday?`本日 ${dateLabel(dueDate)}・${CATEGORIES[t.category]||CATEGORIES.other}${nextLabel}`:`目標 ${dateLabel(dueDate)}・${dayDiff(dueDate,today)}日超過${nextLabel}`;item.append(title,meta);item.onclick=()=>{$("reminderModal").classList.add("hidden");openEdit(t)};box.appendChild(item)})};dueToday.sort((a,b)=>(CATEGORY_ORDER[a.t.category]??99)-(CATEGORY_ORDER[b.t.category]??99)||millis(b.t)-millis(a.t));overdue.sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate))||(CATEGORY_ORDER[a.t.category]??99)-(CATEGORY_ORDER[b.t.category]??99));appendSection("本日期限",dueToday,true);appendSection("期限超過",overdue,false);$("reminderModal").classList.remove("hidden")}
function maybeShowReminders(){const today=todayId();if(reminderShownDate===today)return;reminderShownDate=today;setTimeout(showReminders,250)}
function listen(){if(unsub)unsub();unsub=onSnapshot(query(collection(db,"todos"),where("uid","==",currentUID)),snap=>{todos=snap.docs.map(d=>({id:d.id,...d.data()}));render();maybeShowReminders()},e=>{console.error(e);$("todoList").innerHTML='<div class="empty">Todoを読み込めませんでした。</div>'})}

$("addButton").onclick=()=>openEdit();$("completeButton").onclick=()=>{showCompleted=!showCompleted;render()};$("categoryButton").onclick=e=>{e.stopPropagation();$("sortMenu").classList.add("hidden");$("categoryMenu").classList.toggle("hidden")};$("sortButton").onclick=e=>{e.stopPropagation();$("categoryMenu").classList.add("hidden");$("sortMenu").classList.toggle("hidden")};document.querySelectorAll("#categoryMenu [data-category]").forEach(b=>b.onclick=e=>{e.stopPropagation();category=b.dataset.category;$("categoryMenu").classList.add("hidden");render()});document.querySelectorAll("#sortMenu [data-sort]").forEach(b=>b.onclick=e=>{e.stopPropagation();sortMode=b.dataset.sort;localStorage.setItem("pb.todoStandaloneSort",sortMode);$("sortMenu").classList.add("hidden");render()});$("reportButton").onclick=openReport;$("reportPrev").onclick=()=>shiftReportMonth(-1);$("reportNext").onclick=()=>shiftReportMonth(1);$("closeReport").onclick=closeReport;$("copyReport").onclick=copyReport;$("reportModal").onclick=e=>{if(e.target===$("reportModal"))closeReport()};

$("saveEdit").onclick=async()=>{const title=$("titleInput").value.trim(),initialDueDate=$("initialDueInput").value;if(!title||!initialDueDate){alert("件名と初期目標終了日を入力してください");return}const cleanedItems=editingItems.map(x=>({...x,text:String(x.text||"").trim()})).filter(x=>x.text);if(multiMode&&cleanedItems.length<2){alert("複数Todoには項目を2つ以上追加してください");return}if(multiMode&&cleanedItems.some(x=>!x.dueDate)){alert("各項目の完了期限を入力してください");return}const payload={title,initialDueDate,revisedDueDate:$("revisedDueInput").value||null,category:$("categoryInput").value,details:$("detailsInput").value.trim(),repeatNext:$("repeatNextInput").checked,multiItem:multiMode,items:multiMode?cleanedItems:[],updatedAt:serverTimestamp(),updatedBy:currentId};const btn=$("saveEdit");btn.disabled=true;try{if(editing)await updateDoc(doc(db,"todos",editing.id),payload);else await addDoc(collection(db,"todos"),{...payload,uid:currentUID,senderId:currentId,privateOnly:true,shared:false,completed:false,completedDate:null,completedAt:null,completedBy:null,nextTodoPending:false,nextTodoCreated:false,nextTodoId:null,nextDueDate:null,createdAt:serverTimestamp()});closeEdit()}catch(e){console.error(e);alert("Todoを保存できませんでした。")}finally{btn.disabled=false}};
$("cancelComplete").onclick=closeComplete;$("completeModal").onclick=e=>{if(e.target===$("completeModal"))closeComplete()};async function saveCompletion(nextPending=false){if(!completing)return;const completedDate=$("completedDateInput").value;if(!completedDate){alert("完了日を入力してください");return}const needsNext=!!completing.repeatNext&&!completing.nextTodoCreated,nextDueDate=needsNext&&!nextPending?$("nextDueInput").value:"";if(needsNext&&!nextPending&&!nextDueDate){alert("次回予定日を選ぶか、『次回未定で完了』を押してください");return}if(nextDueDate&&nextDueDate<completedDate){alert("次回予定日は完了日以降を選んでください");return}const buttons=[$("saveComplete"),$("saveCompletePending")];buttons.forEach(b=>b.disabled=true);const payload={completed:true,completedDate,completedAt:serverTimestamp(),completedBy:currentId,updatedAt:serverTimestamp(),updatedBy:currentId};if(completingItems)payload.items=completingItems;if(needsNext&&nextPending)Object.assign(payload,{nextTodoPending:true,nextTodoCreated:false,nextTodoId:null,nextDueDate:null});try{if(needsNext&&nextDueDate)await createNext(completing,nextDueDate,payload);else await updateDoc(doc(db,"todos",completing.id),payload);closeComplete()}catch(e){console.error(e);alert(e?.message==="NEXT_ALREADY_CREATED"?"次回Todoはすでに登録されています。":"完了にできませんでした。")}finally{buttons.forEach(b=>b.disabled=false)}}$("saveComplete").onclick=()=>saveCompletion(false);$("saveCompletePending").onclick=()=>saveCompletion(true);$("completedDateInput").onchange=e=>{$("nextDueInput").min=e.target.value||todayId()};$("nextDueInput").onchange=e=>{$("nextDueWeekday").textContent=e.target.value?asDate(e.target.value).toLocaleDateString("ja-JP",{weekday:"long"}):""};$("cancelNext").onclick=closeNext;$("nextModal").onclick=e=>{if(e.target===$("nextModal"))closeNext()};$("laterNextDueInput").onchange=e=>{$("laterNextDueWeekday").textContent=e.target.value?asDate(e.target.value).toLocaleDateString("ja-JP",{weekday:"long"}):""};$("saveNext").onclick=async()=>{if(!registeringNext)return;const dueDate=$("lat
