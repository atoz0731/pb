<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>負債状況</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#777;--border:#dedee3;--danger:#c53a3a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",Meiryo,sans-serif}
body{min-height:100dvh}button,input,select,textarea{font:inherit}.hidden{display:none!important}
.shell{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(26px + env(safe-area-inset-bottom))}
.header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:48px}.header h1{font-size:20px;margin:0;text-align:center}.header button{border:0;background:none;font-size:25px;min-width:44px;min-height:44px}
.subtle{font-size:11px;color:var(--muted);text-align:center;margin-top:-2px;margin-bottom:10px}
.loginCard,.summary,.debtCard,.empty,.modalCard{background:var(--card);border:1px solid var(--border);border-radius:16px}
.loginCard{padding:16px;margin-top:26px}.loginCard h2{font-size:18px;margin:0 0 12px}
.field{margin:0 0 12px;min-width:0}.field label{display:block;font-size:12px;font-weight:700;color:#555;margin:0 0 5px}
.field input,.field select,.field textarea{display:block;width:100%;min-width:0;border:1px solid #d3d3d8;border-radius:10px;background:#fff;padding:10px 11px;font-size:16px;color:#111;outline:none}
.field textarea{resize:vertical;min-height:74px}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.action{width:100%;border:0;border-radius:11px;background:#111;color:#fff;font-weight:800;padding:12px}.error{font-size:12px;color:var(--danger);min-height:18px;margin-top:8px}
.summary{padding:14px;margin-bottom:12px}.summaryHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.summaryHead h2{font-size:15px;margin:0}.summaryHead span{font-size:11px;color:var(--muted)}
.summaryPrimary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#f7f7f9;border-radius:12px;padding:10px;min-width:0}.metric.wide{grid-column:1/-1}.metric .k{font-size:10px;color:#777;margin-bottom:3px}.metric .v{font-size:18px;font-weight:800;word-break:break-all}.metric .v.small{font-size:15px}
.burdenRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.burden{border-top:1px solid #ececef;padding-top:9px}.burden .name{font-size:11px;color:#666}.burden .money{font-size:17px;font-weight:800;margin-top:2px}.burden .note{font-size:10px;color:#999;margin-top:2px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.toolbar .add{flex:1;border:0;background:#111;color:#fff;border-radius:12px;padding:11px 12px;font-weight:800}.toolbar .refresh{width:46px;border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px 0;font-size:18px}
.debtList{display:flex;flex-direction:column;gap:10px}.debtCard{padding:12px}.debtTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.debtName{font-size:15px;font-weight:800;min-width:0;word-break:break-word}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.badge{font-size:10px;border-radius:999px;background:#ededf0;color:#555;padding:3px 7px}.badge.revo{background:#f3ece2;color:#7a5422}
.cardActions{display:flex;gap:5px;flex-shrink:0}.cardActions button{border:1px solid var(--border);background:#fff;border-radius:9px;padding:6px 8px;font-size:11px}.cardActions .del{color:var(--danger)}
.debtNumbers{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.mini{background:#f8f8fa;border-radius:10px;padding:8px}.mini .k{font-size:9px;color:#888}.mini .v{font-size:13px;font-weight:800;margin-top:2px}
.debtMeta{font-size:10px;color:#777;line-height:1.55;margin-top:9px}.warn{margin-top:8px;padding:7px 8px;border-radius:9px;background:#fff3f3;color:#a33;font-size:11px}.memo{margin-top:8px;padding-top:8px;border-top:1px solid #eee;font-size:11px;color:#555;white-space:pre-wrap}.empty{text-align:center;padding:28px 16px;color:#888;font-size:13px}
.modalOverlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center;padding:14px 10px calc(14px + env(safe-area-inset-bottom))}
.modalCard{width:min(100%,620px);max-height:90dvh;overflow:auto;padding:15px;border-radius:18px}.modalTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.modalTitle h3{margin:0;font-size:17px}.modalTitle button{border:0;background:none;font-size:26px;line-height:1}
.sectionLabel{font-size:11px;font-weight:800;color:#777;margin:14px 0 7px}.radioRow{display:grid;grid-template-columns:1fr 1fr;gap:7px}.radioBtn{position:relative;border:1px solid var(--border);border-radius:10px;padding:9px 7px;text-align:center;font-size:12px;font-weight:700;background:#fff}.radioBtn input{position:absolute;opacity:0;pointer-events:none}.radioBtn.active{background:#111;color:#fff;border-color:#111}.helper{font-size:10px;color:#888;margin-top:5px;line-height:1.45}
.preview{background:#f5f5f7;border-radius:12px;padding:10px;margin:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:7px}.preview .k{font-size:9px;color:#888}.preview .v{font-size:13px;font-weight:800;margin-top:2px}
.modalBtns{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:13px}.modalBtns button{border-radius:11px;padding:11px;border:1px solid var(--border);background:#fff;font-weight:800}.modalBtns .save{background:#111;color:#fff;border-color:#111}
@media(max-width:390px){.grid2{grid-template-columns:1fr}.metric .v{font-size:16px}}
</style>
</head>
<body>
<div class="shell">
  <div class="header"><button id="backBtn" type="button" aria-label="戻る">‹</button><h1>負債状況</h1><span></span></div>
  <div class="subtle">返済見込みシミュレーション</div>

  <section id="loginBox" class="loginCard hidden">
    <h2>開く</h2>
    <div class="field"><input id="loginId" autocomplete="username" placeholder="ID"></div>
    <div class="field"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="パスワード"></div>
    <button id="loginButton" class="action" type="button">開く</button>
    <div id="loginError" class="error"></div>
  </section>

  <main id="appBox" class="hidden">
    <section class="summary">
      <div class="summaryHead"><h2>全体</h2><span id="debtCount">0件</span></div>
      <div class="summaryPrimary">
        <div class="metric"><div class="k">現在残高</div><div id="sumBalance" class="v">¥0</div></div>
        <div class="metric"><div class="k">今後の返済予定総額</div><div id="sumFuture" class="v">¥0</div></div>
        <div class="metric"><div class="k">見込利息</div><div id="sumInterest" class="v">¥0</div></div>
        <div class="metric"><div class="k">月々の返済額合計</div><div id="sumMonthly" class="v">¥0</div></div>
        <div class="metric wide"><div class="k">全体完済見込み</div><div id="sumPayoff" class="v small">—</div></div>
      </div>
      <div class="burdenRow">
        <div class="burden"><div class="name">ひとみ負担見込</div><div id="sumHitomi" class="money">¥0</div><div id="sumHitomiPct" class="note">—</div></div>
        <div class="burden"><div class="name">旦那さん負担見込</div><div id="sumHusband" class="money">¥0</div><div id="sumHusbandPct" class="note">—</div></div>
      </div>
    </section>
    <div class="toolbar"><button id="addDebt" class="add" type="button">＋ 借入を追加</button><button id="refreshButton" class="refresh" type="button" aria-label="再読込">↻</button></div>
    <section id="debtList" class="debtList"></section>
  </main>
</div>

<div id="debtModal" class="modalOverlay hidden" role="dialog" aria-modal="true">
  <div class="modalCard">
    <div class="modalTitle"><h3 id="modalHeading">借入を追加</h3><button id="closeModal" type="button" aria-label="閉じる">×</button></div>
    <div class="field"><label for="lender">借入元</label><input id="lender" maxlength="100" placeholder="例：○○カード、○○銀行"></div>
    <div class="grid2">
      <div class="field"><label for="borrowDate">借りた月日</label><input id="borrowDate" type="date"></div>
      <div class="field"><label for="originalAmount">借入額</label><input id="originalAmount" type="number" inputmode="numeric" min="0" step="1" placeholder="500000"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="currentBalance">現在残高</label><input id="currentBalance" type="number" inputmode="numeric" min="0" step="1" placeholder="480000"></div>
      <div class="field"><label for="annualRate">年利（%）</label><input id="annualRate" type="number" inputmode="decimal" min="0" max="100" step="0.01" placeholder="15.0"></div>
    </div>
    <div class="field">
      <label for="repaymentType">返済方式</label>
      <select id="repaymentType">
        <option value="annuity">元利均等・通常分割</option>
        <option value="principal">元金均等</option>
        <option value="revo">リボ払い</option>
        <option value="interestFree">利息なし</option>
      </select>
    </div>

    <div id="revoCalcModeBox" class="hidden">
      <div class="sectionLabel">リボの計算方法</div>
      <div class="radioRow">
        <label id="modeMonthsLabel" class="radioBtn active"><input type="radio" name="calcMode" value="months" checked>完済月数から逆算</label>
        <label id="modePaymentLabel" class="radioBtn"><input type="radio" name="calcMode" value="payment">毎月返済額から計算</label>
      </div>
    </div>

    <div id="monthsField" class="field"><label for="remainingMonths">残り何か月で支払うか</label><input id="remainingMonths" type="number" inputmode="numeric" min="1" max="600" step="1" value="24"></div>
    <div id="monthlyPaymentField" class="field hidden">
      <label for="monthlyPayment">毎月の返済額</label>
      <input id="monthlyPayment" type="number" inputmode="numeric" min="1" step="1" placeholder="20000">
      <div class="helper">定額リボの概算。毎月の利息を差し引きながら完済まで月ごとに計算します。</div>
    </div>

    <div class="field">
      <label for="husbandShare">旦那さんの負担割合（%）</label>
      <input id="husbandShare" type="number" inputmode="decimal" min="0" max="100" step="0.1" value="50">
      <div class="helper">ひとみ負担は「100% − 旦那さん負担割合」で自動計算します。</div>
    </div>

    <div class="preview">
      <div><div class="k">月々返済</div><div id="previewMonthly" class="v">—</div></div>
      <div><div class="k">残り月数</div><div id="previewMonths" class="v">—</div></div>
      <div><div class="k">今後支払総額</div><div id="previewTotal" class="v">—</div></div>
      <div><div class="k">見込利息</div><div id="previewInterest" class="v">—</div></div>
      <div><div class="k">ひとみ負担</div><div id="previewHitomi" class="v">—</div></div>
      <div><div class="k">旦那さん負担</div><div id="previewHusband" class="v">—</div></div>
    </div>
    <div id="previewWarning" class="warn hidden"></div>

    <div class="field"><label for="memo">メモ（任意）</label><textarea id="memo" maxlength="2000" placeholder="カード会社の条件、締日など"></textarea></div>
    <div class="modalBtns"><button id="cancelModal" type="button">キャンセル</button><button id="saveDebt" class="save" type="button">保存</button></div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBYEhnK2xJPYW457kgCme2KQJJEtJlowgk",
  authDomain:"message-57e2d.firebaseapp.com",
  projectId:"message-57e2d",
  storageBucket:"message-57e2d.firebasestorage.app",
  messagingSenderId:"560072908841",
  appId:"1:560072908841:web:a6d0e92a57a24c152a3c38"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let currentUID="",currentId="",debts=[],unsubDebts=null,editingId=null;

const yen=n=>Number.isFinite(Number(n))?new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(Math.round(Number(n))):"—";
const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
const num=(id,fallback=0)=>Number.isFinite(Number($(id)?.value))?Number($(id).value):fallback;

function calcAnnuity(balance,annualRate,months){
  balance=Math.max(0,balance);months=Math.max(1,Math.round(months));
  const r=Math.max(0,annualRate)/100/12;
  if(balance===0)return{monthly:0,total:0,interest:0,months};
  if(r===0)return{monthly:balance/months,total:balance,interest:0,months};
  const monthly=balance*r/(1-Math.pow(1+r,-months)),total=monthly*months;
  return{monthly,total,interest:total-balance,months};
}
function calcPrincipalEqual(balance,annualRate,months){
  balance=Math.max(0,balance);months=Math.max(1,Math.round(months));const r=Math.max(0,annualRate)/100/12;
  if(balance===0)return{monthly:0,total:0,interest:0,months};
  const principal=balance/months;let remaining=balance,total=0,first=0;
  for(let i=0;i<months;i++){const p=principal+remaining*r;if(i===0)first=p;total+=p;remaining=Math.max(0,remaining-principal)}
  return{monthly:first,total,interest:total-balance,months,note:"月々返済額は初月。元金均等のため毎月減少します。"};
}
function calcRevoByPayment(balance,annualRate,payment){
  balance=Math.max(0,balance);payment=Math.max(0,payment);const r=Math.max(0,annualRate)/100/12;
  if(balance===0)return{monthly:0,total:0,interest:0,months:0};
  if(payment<=0)return{invalid:true,warning:"毎月返済額を入力してください。"};
  if(r>0&&payment<=balance*r)return{invalid:true,warning:"毎月返済額が初月の利息以下のため、この条件では残高が減りません。"};
  let remaining=balance,total=0,months=0;
  while(remaining>0.01&&months<1200){const interest=remaining*r,due=remaining+interest,paid=Math.min(payment,due);total+=paid;remaining=due-paid;months++}
  if(months>=1200)return{invalid:true,warning:"完済までの期間が長すぎるため計算を停止しました。"};
  return{monthly:payment,total,interest:Math.max(0,total-balance),months};
}
function calculateDebt(d){
  const balance=Math.max(0,Number(d.currentBalance)||0),rate=Math.max(0,Number(d.annualRate)||0),months=Math.max(1,Math.round(Number(d.remainingMonths)||1));
  let c;
  if(d.repaymentType==="principal")c=calcPrincipalEqual(balance,rate,months);
  else if(d.repaymentType==="interestFree")c={monthly:balance/months,total:balance,interest:0,months};
  else if(d.repaymentType==="revo"&&d.calcMode==="payment")c=calcRevoByPayment(balance,rate,Number(d.monthlyPayment)||0);
  else c=calcAnnuity(balance,rate,months);
  if(!c.invalid){const hs=clamp(Number(d.husbandShare)||0,0,100)/100;c.husband=c.total*hs;c.hitomi=c.total-c.husband}
  return c;
}
function payoffLabel(months){if(!Number.isFinite(months)||months<0)return"—";const now=new Date(),d=new Date(now.getFullYear(),now.getMonth()+Math.round(months),1);return`${d.getFullYear()}年${d.getMonth()+1}月`}
function typeLabel(t){return t==="principal"?"元金均等":t==="revo"?"リボ":t==="interestFree"?"利息なし":"元利均等"}

function currentFormData(){
  return{
    lender:$("lender").value.trim(),borrowDate:$("borrowDate").value,originalAmount:num("originalAmount"),currentBalance:num("currentBalance"),annualRate:num("annualRate"),
    repaymentType:$("repaymentType").value,calcMode:document.querySelector('input[name="calcMode"]:checked')?.value||"months",
    remainingMonths:Math.max(1,Math.round(num("remainingMonths",24))),monthlyPayment:num("monthlyPayment"),husbandShare:clamp(num("husbandShare",50),0,100),memo:$("memo").value.trim()
  };
}
function syncCalcModeUI(){
  const isRevo=$("repaymentType").value==="revo",mode=document.querySelector('input[name="calcMode"]:checked')?.value||"months";
  $("revoCalcModeBox").classList.toggle("hidden",!isRevo);$("modeMonthsLabel").classList.toggle("active",mode==="months");$("modePaymentLabel").classList.toggle("active",mode==="payment");
  $("monthsField").classList.toggle("hidden",isRevo&&mode==="payment");$("monthlyPaymentField").classList.toggle("hidden",!(isRevo&&mode==="payment"));updatePreview();
}
function updatePreview(){
  const c=calculateDebt(currentFormData()),warn=$("previewWarning");
  if(c.invalid){["previewMonthly","previewMonths","previewTotal","previewInterest","previewHitomi","previewHusband"].forEach(id=>$(id).textContent="—");warn.textContent=c.warning||"計算できません";warn.classList.remove("hidden");return}
  $("previewMonthly").textContent=yen(c.monthly);$("previewMonths").textContent=`${c.months}か月`;$("previewTotal").textContent=yen(c.total);$("previewInterest").textContent=yen(c.interest);$("previewHitomi").textContent=yen(c.hitomi);$("previewHusband").textContent=yen(c.husband);
  if(c.note){warn.textContent=c.note;warn.classList.remove("hidden")}else{warn.classList.add("hidden");warn.textContent=""}
}
function render(){
  const list=$("debtList");list.innerHTML="";
  const valid=debts.map(d=>({d,c:calculateDebt(d)})).filter(x=>!x.c.invalid),balance=debts.reduce((s,d)=>s+(Number(d.currentBalance)||0),0),total=valid.reduce((s,x)=>s+x.c.total,0),interest=valid.reduce((s,x)=>s+x.c.interest,0),monthly=valid.reduce((s,x)=>s+x.c.monthly,0),husband=valid.reduce((s,x)=>s+x.c.husband,0),hitomi=valid.reduce((s,x)=>s+x.c.hitomi,0),maxMonths=valid.length?Math.max(...valid.map(x=>x.c.months)):0;
  $("debtCount").textContent=`${debts.length}件`;$("sumBalance").textContent=yen(balance);$("sumFuture").textContent=yen(total);$("sumInterest").textContent=yen(interest);$("sumMonthly").textContent=yen(monthly);$("sumPayoff").textContent=valid.length?payoffLabel(maxMonths):"—";$("sumHitomi").textContent=yen(hitomi);$("sumHusband").textContent=yen(husband);$("sumHitomiPct").textContent=total>0?`全体の ${(hitomi/total*100).toFixed(1)}%`:"—";$("sumHusbandPct").textContent=total>0?`全体の ${(husband/total*100).toFixed(1)}%`:"—";
  if(!debts.length){list.innerHTML='<div class="empty">まだ借入は登録されていません。<br>「＋ 借入を追加」から登録できます。</div>';return}
  for(const d of [...debts].sort((a,b)=>(a.lender||"").localeCompare(b.lender||"","ja"))){
    const c=calculateDebt(d),card=document.createElement("article"),isRevo=d.repaymentType==="revo";
    card.className="debtCard";
    card.innerHTML=`<div class="debtTop"><div><div class="debtName"></div><div class="badges"><span class="badge ${isRevo?"revo":""}">${typeLabel(d.repaymentType)}</span><span class="badge">年利 ${Number(d.annualRate||0).toFixed(2)}%</span><span class="badge">旦那 ${Number(d.husbandShare||0).toFixed(1)}%</span></div></div><div class="cardActions"><button class="edit" type="button">編集</button><button class="del" type="button">削除</button></div></div><div class="debtNumbers"><div class="mini"><div class="k">現在残高</div><div class="v">${yen(d.currentBalance)}</div></div><div class="mini"><div class="k">月々返済</div><div class="v">${c.invalid?"—":yen(c.monthly)}</div></div><div class="mini"><div class="k">今後支払総額</div><div class="v">${c.invalid?"—":yen(c.total)}</div></div><div class="mini"><div class="k">完済見込み</div><div class="v">${c.invalid?"—":payoffLabel(c.months)}</div></div></div><div class="debtMeta"></div>${c.invalid?'<div class="warn"></div>':""}${d.memo?'<div class="memo"></div>':""}`;
    card.querySelector(".debtName").textContent=d.lender||"名称未設定";
    const meta=[];if(d.borrowDate)meta.push(`借入日 ${d.borrowDate.replaceAll("-","/")}`);if(Number(d.originalAmount))meta.push(`当初借入 ${yen(d.originalAmount)}`);if(!c.invalid){meta.push(`残り ${c.months}か月`);meta.push(`見込利息 ${yen(c.interest)}`);meta.push(`ひとみ ${yen(c.hitomi)} / 旦那さん ${yen(c.husband)}`)}card.querySelector(".debtMeta").textContent=meta.join(" ・ ");
    if(c.invalid)card.querySelector(".warn").textContent=c.warning||"計算条件を確認してください";if(d.memo)card.querySelector(".memo").textContent=d.memo;
    card.querySelector(".edit").onclick=()=>openEdit(d);card.querySelector(".del").onclick=async()=>{if(!confirm(`「${d.lender||"この借入"}」を削除しますか？`))return;try{await deleteDoc(doc(db,"debts",d.id))}catch(e){console.error(e);alert("削除できませんでした")}};
    list.appendChild(card);
  }
}
function clearForm(){editingId=null;$("modalHeading").textContent="借入を追加";$("lender").value="";$("borrowDate").value="";$("originalAmount").value="";$("currentBalance").value="";$("annualRate").value="";$("repaymentType").value="annuity";document.querySelector('input[name="calcMode"][value="months"]').checked=true;$("remainingMonths").value="24";$("monthlyPayment").value="";$("husbandShare").value="50";$("memo").value="";syncCalcModeUI()}
function openCreate(){clearForm();$("debtModal").classList.remove("hidden");setTimeout(()=>$("lender").focus(),50)}
function openEdit(d){editingId=d.id;$("modalHeading").textContent="借入を編集";$("lender").value=d.lender||"";$("borrowDate").value=d.borrowDate||"";$("originalAmount").value=Number(d.originalAmount)||"";$("currentBalance").value=Number(d.currentBalance)||"";$("annualRate").value=Number(d.annualRate)||0;$("repaymentType").value=d.repaymentType||"annuity";document.querySelector(`input[name="calcMode"][value="${d.calcMode==="payment"?"payment":"months"}"]`).checked=true;$("remainingMonths").value=Number(d.remainingMonths)||24;$("monthlyPayment").value=Number(d.monthlyPayment)||"";$("husbandShare").value=Number.isFinite(Number(d.husbandShare))?Number(d.husbandShare):50;$("memo").value=d.memo||"";syncCalcModeUI();$("debtModal").classList.remove("hidden")}
function closeModal(){$("debtModal").classList.add("hidden")}
async function saveDebt(){
  const d=currentFormData();if(!d.lender){alert("借入元を入力してください");return}if(d.currentBalance===0&&d.originalAmount>0)d.currentBalance=d.originalAmount;if(d.currentBalance<=0){alert("現在残高を入力してください");return}if(d.annualRate<0||d.annualRate>100){alert("年利を確認してください");return}
  const c=calculateDebt(d);if(c.invalid){alert(c.warning||"返済条件を確認してください");return}
  const payload={...d,updatedAt:serverTimestamp()};
  try{if(editingId)await updateDoc(doc(db,"debts",editingId),payload);else await addDoc(collection(db,"debts"),{...payload,createdByUid:currentUID,createdById:currentId,createdAt:serverTimestamp()});closeModal()}catch(e){console.error(e);alert("保存できませんでした")}
}
function listenDebts(){if(unsubDebts)unsubDebts();unsubDebts=onSnapshot(collection(db,"debts"),snap=>{debts=snap.docs.map(x=>({id:x.id,...x.data()}));render()},err=>{console.error(err);debts=[];render();$("debtList").innerHTML='<div class="empty">負債データを読み込めませんでした。<br>Firestoreの権限設定も確認してください。</div>'})}

$("addDebt").onclick=openCreate;$("closeModal").onclick=closeModal;$("cancelModal").onclick=closeModal;$("saveDebt").onclick=saveDebt;$("refreshButton").onclick=render;$("backBtn").onclick=()=>{if(history.length>1)history.back();else location.href="index.html"};$("debtModal").addEventListener("click",e=>{if(e.target===$("debtModal"))closeModal()});$("repaymentType").addEventListener("change",syncCalcModeUI);document.querySelectorAll('input[name="calcMode"]').forEach(x=>x.addEventListener("change",syncCalcModeUI));["originalAmount","currentBalance","annualRate","remainingMonths","monthlyPayment","husbandShare"].forEach(id=>$(id).addEventListener("input",updatePreview));
$("loginButton").onclick=async()=>{const id=$("loginId").value.trim(),pw=$("loginPassword").value;if(!id||!pw)return;$("loginError").textContent="";try{await signInWithEmailAndPassword(auth,`${id}@pb.local`,pw)}catch(e){console.error(e);$("loginError").textContent="開けませんでした"}};$("loginPassword").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginButton").click()});
onAuthStateChanged(auth,user=>{if(user){currentUID=user.uid;currentId=(user.email||"").replace("@pb.local","");$("loginBox").classList.add("hidden");$("appBox").classList.remove("hidden");listenDebts()}else{currentUID="";currentId="";if(unsubDebts){unsubDebts();unsubDebts=null}debts=[];$("appBox").classList.add("hidden");$("loginBox").classList.remove("hidden")}});
</script>
</body>
</html>
