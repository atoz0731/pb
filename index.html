<html lang="ja">

<style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  color:#222;
}
button,input,textarea{font:inherit}

.hidden{display:none!important}

/* ===== PIN ===== */

#pinScreen{
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  background:#f7f7f7;
}
.pinBox{
  width:100%;
  max-width:360px;
  text-align:center;
}
.pinTitle{
  font-weight:600;
  font-size:17px;
  margin-bottom:28px;
}
.pinDots{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-bottom:34px;
}
.pinDot{
  width:15px;
  height:15px;
  border:1.5px solid #555;
  border-radius:50%;
}
.pinDot.on{background:#222}
.keypad{
  display:grid;
  grid-template-columns:repeat(3,72px);
  gap:15px 20px;
  justify-content:center;
}
.key{
  width:72px;
  height:72px;
  border:0;
  border-radius:50%;
  background:#e4e4e4;
  font-size:25px;
}
.key:active{background:#ccc}
.key.blank{visibility:hidden}
#pinError{
  height:22px;
  margin-top:18px;
  color:#999;
  font-size:13px;
}

/* ===== LOGIN ===== */

#loginScreen{
  min-height:100dvh;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.loginCard{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:25px;
  padding:34px 24px;
}
.logo{text-align:center;margin-bottom:30px}
.logo h1{
  margin:0;
  font-size:52px;
  letter-spacing:-3px;
}
.logo p{margin:4px 0;color:#777}
.field{margin:16px 0}
.field label{
  display:block;
  font-weight:600;
  margin-bottom:7px;
}
.field input,
.field textarea{
  width:100%;
  padding:14px 15px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
}
.primary{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#111;
  color:white;
  font-weight:700;
}
#loginError{
  min-height:20px;
  margin-top:12px;
  text-align:center;
  color:#c33;
}

/* ===== APP ===== */

#appScreen{
  height:100dvh;
  display:flex;
  flex-direction:column;
}
header{
  flex-shrink:0;
  background:#111;
  color:white;

}
.brand{font-size:22px;font-weight:800}

header button{

  color:white;
  border:0;
  font-size:13px;
}

.tabs{
  flex-shrink:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:white;
  border-bottom:1px solid #ddd;
}
.tab{
  padding:12px 2px 10px;
  border:0;
  background:white;
  font-weight:600;
  color:#888;
  font-size:13px;
}
.tab.active{
  color:#111;
  border-bottom:3px solid #111;
}

.page{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}
.scroll{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

/* ===== VOICE ROOM ===== */

#voicePanel{
  flex-shrink:0;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:10px 13px;
}
.voiceInner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.voiceTitle{
  font-size:13px;
  font-weight:700;
}
.voiceStatus{

}
.voiceButtons{

}
.voiceBtn{
  border:0;

  font-weight:700;
}
.voiceJoin{
  background:#111;
  color:#fff;
}
.voiceSub{
  background:#eee;
  color:#222;
}
.voiceDanger{
  background:#efefef;
  color:#b00020;
}
.voiceLive{
  color:#16833c;
}
.voiceDot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#1ca64c;
  margin-right:5px;
}

/* ===== TALK ===== */

#messages{
  padding:12px 13px;
}
#loadMore{
  display:block;
  margin:0 auto 14px;
  padding:7px 14px;
  border:0;
  border-radius:18px;
  background:#ddd;
  font-size:12px;
}
.messageRow{

  flex-direction:column;
  align-items:flex-start;
  margin:8px 0 13px;
}
.messageRow.mine{

}
.sender{

}

.emojiText.one{font-size:64px;line-height:1.15}
.emojiText.two{font-size:54px;line-height:1.15}

}

.meta{

.readMark{

}
.reactionSummary{

}
.reactionChip{

}
.reactionChip.mineReaction{

}
.messageActions{

  gap:3px;

}
.messageActions button{

  font-size:11px;

}

.reactionPicker{

.reactionPicker button{

#replyBar,

#replyBar button,
#editBar button{

.composer{

}
.composer textarea{

  min-height:43px;

.send{

/* ===== SOLO ===== */

#soloList{

#scheduleList{

}
.scheduleCard{

.scheduleDate{
  font-size:12px;
  color:#777;
}
.scheduleTitle{

}
.scheduleMemo{

  font-size:11px;

/* ===== LOCATION ===== */

.locationCard{

  top:2px;

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp,
  doc,
  updateDoc,
  deleteDoc,
  setDoc,
  getDoc,
  startAfter,
  getDocs,
  arrayUnion,
  arrayRemove,
  where,
  Timestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBYEhnK2xJPYW457kgCme2KQJJEtJlowgk",
  authDomain: "message-57e2d.firebaseapp.com",
  projectId: "message-57e2d",
  storageBucket: "message-57e2d.firebasestorage.app",
  messagingSenderId: "560072908841",
  appId: "1:560072908841:web:a6d0e92a57a24c152a3c38"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);


/* =====================================================
   GLOBAL
===================================================== */

let pin = "";
let pinPassed = false;

let currentUID = "";
let currentId = "";

let replyTarget = null;
let editingMessage = null;

let oldestMessage = null;
let messageDocs = new Map();

let locationWatch = null;

let unsubscribeMessages = null;
let unsubscribeSolo = null;
let unsubscribeSchedule = null;
let unsubscribeLocations = null;
let unsubscribeReads = null;
let unsubscribeVoice = null;

let readStates = {};

const REACTIONS = ["👍","❤️","😂","😮","😢"];


/* =====================================================
   PIN
===================================================== */

function updateDots(){
  document.querySelectorAll(".pinDot").forEach((dot,i)=>{
    dot.classList.toggle("on", i < pin.length);
  });
}

document.querySelectorAll(".key").forEach(key => {

  if(
    key.id === "backKey" ||
    key.classList.contains("blank")
  ) return;

  key.addEventListener("click",()=>{

    if(pin.length >= 4) return;

    pin += key.textContent;
    updateDots();

    if(pin.length === 4){
      setTimeout(checkPin,120);
    }

  });

});

$("backKey").onclick = () => {
  pin = pin.slice(0,-1);
  updateDots();
};

function checkPin(){

  if(pin === "0208"){
    window.location.replace("https://www.google.com/");
    return;
  }

  if(pin === "0814"){

    pinPassed = true;

    $("pinScreen").classList.add("hidden");

    if(auth.currentUser){
      showApp(auth.currentUser);
    }else{
      $("loginScreen").classList.remove("hidden");
    }

    return;
  }

  $("pinError").textContent = "PINが違います";

  pin = "";
  updateDots();

  setTimeout(()=>{
    $("pinError").textContent = "";
  },1000);
}


/* =====================================================
   LOGIN
===================================================== */

$("loginButton").onclick = async () => {

  const id =
    $("loginId").value.trim().toLowerCase();

  const password =
    $("loginPassword").value;

  if(!id || !password) return;

  try{

    $("loginError").textContent = "";

    await signInWithEmailAndPassword(
      auth,
      `${id}@pb.local`,
      password
    );

  }catch(error){

    console.error(error);

    $("loginError").textContent =
      "IDまたはパスワードが違います";

  }

};

$("loginPassword").addEventListener("keydown", e => {
  if(e.key === "Enter"){
    $("loginButton").click();
  }
});

$("logoutButton").onclick = async () => {

  await leaveVoiceRoom(false);

  await signOut(auth);

  $("appScreen").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");

};

onAuthStateChanged(auth,user=>{

  if(user && pinPassed){
    showApp(user);
  }

  if(!user && pinPassed){
    $("appScreen").classList.add("hidden");
    $("loginScreen").classList.remove("hidden");
  }

});

function showApp(user){

  currentUID = user.uid;

  currentId =
    (user.email || "")
    .replace("@pb.local","");

  $("userLabel").textContent =
    `ID：${currentId}`;

  $("loginScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");

  listenMessages();
  listenReadStates();
  listenSolo();
  listenSchedules();
  listenLocations();
  listenVoiceRoom();

}


/* =====================================================
   TABS
===================================================== */

document.querySelectorAll(".tab").forEach(tab=>{

  tab.onclick = () => {

    document.querySelectorAll(".tab")
      .forEach(t=>t.classList.remove("active"));

    tab.classList.add("active");

    [
      "talkPage",
      "soloPage",
      "schedulePage",
      "locationPage"
    ].forEach(page=>{
      $(page).classList.add("hidden");
    });

    $(tab.dataset.page).classList.remove("hidden");

    if(tab.dataset.page === "talkPage"){
      markTalkRead();
    }

  };

});


/* =====================================================
   EMOJI CHECK
===================================================== */

/*
  絵文字だけのメッセージかを簡易判定。
  1〜3個ならスタンプ風表示。
*/

function getEmojiCount(text){

  const cleaned =
    text
    .replace(/\s/g,"")
    .replace(/\uFE0F/g,"");

  if(!cleaned) return 0;

  const emojiRegex =
    /(?:\p{Extended_Pictographic}(?:\uFE0F|\uFE0E)?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|\uFE0E)?)?|\p{Regional_Indicator}{2})/gu;

  const matches = cleaned.match(emojiRegex);

  if(!matches) return 0;

  const joined =
    matches.join("")
    .replace(/\uFE0F/g,"");

  if(joined !== cleaned){
    return 0;
  }

  return matches.length;
}


/* =====================================================
   MESSAGES
===================================================== */

function listenMessages(){

  if(unsubscribeMessages){
    unsubscribeMessages();
  }

  const q = query(
    collection(db,"messages"),
    orderBy("createdAt","desc"),
    limit(50)
  );

  unsubscribeMessages =
    onSnapshot(q,snapshot=>{

      const docs =
        [...snapshot.docs].reverse();

      messageDocs.clear();

      docs.forEach(d=>{
        messageDocs.set(
          d.id,
          { id:d.id, ...d.data() }
        );
      });

      oldestMessage =
        snapshot.docs[
          snapshot.docs.length - 1
        ] || null;

      renderMessages();

      markTalkRead();

    });

}


function renderMessages(){

  const list = $("messageList");

  list.innerHTML = "";

  const items =
    [...messageDocs.values()]
    .sort((a,b)=>{

      const at =
        a.createdAt?.seconds || 0;

      const bt =
        b.createdAt?.seconds || 0;

      return at - bt;

    });


  items.forEach(data=>{

    const row =
      document.createElement("div");

    row.className =
      "messageRow" +
      (data.uid === currentUID
        ? " mine"
        : "");


    const sender =
      document.createElement("div");

    sender.className = "sender";

    sender.textContent =
      data.uid === currentUID
      ? "自分"
      : data.senderId;


    const bubble =
      document.createElement("div");

    bubble.className = "bubble";


    /* REPLY QUOTE */

    if(data.replyTo){

      const quote =
        document.createElement("div");

      quote.className = "replyQuote";

      quote.textContent =
        `${data.replyTo.senderId}：${data.replyTo.text}`;

      bubble.appendChild(quote);

    }


    /* BODY */

    const body =
      document.createElement("div");

    if(data.deleted){

      body.textContent =
        "このメッセージは削除されました";

      body.className = "deleted";

    }else{

      body.textContent =
        data.text || "";

      const emojiCount =
        getEmojiCount(data.text || "");

      if(
        emojiCount >= 1 &&
        emojiCount <= 3
      ){

        bubble.classList.add("emojiBubble");

        body.className =
          "emojiText " +
          (
            emojiCount === 1
            ? "one"
            : emojiCount === 2
            ? "two"
            : "three"
          );

      }

    }

    bubble.appendChild(body);


    /* META */

    const meta =
      document.createElement("div");

    meta.className = "meta";

    const timeSpan =
      document.createElement("span");

    if(data.createdAt?.toDate){

      timeSpan.textContent =
        data.createdAt
        .toDate()
        .toLocaleString(
          "ja-JP",
          {
            month:"numeric",
            day:"numeric",
            hour:"2-digit",
            minute:"2-digit"
          }
        );

    }

    meta.appendChild(timeSpan);

    if(data.edited){

      const edited =
        document.createElement("span");

      edited.textContent =
        "編集済み";

      meta.appendChild(edited);

    }

    /* READ */

    if(
      data.uid === currentUID &&
      !data.deleted &&
      isReadByOther(data)
    ){

      const read =
        document.createElement("span");

      read.className = "readMark";

      read.textContent = "既読";

      meta.appendChild(read);

    }


    row.append(
      sender,
      bubble
    );


    /* REACTIONS */

    if(!data.deleted){

      const summary =
        buildReactionSummary(data);

      if(summary){
        row.appendChild(summary);
      }

    }


    row.appendChild(meta);


    /* ACTIONS */

    if(!data.deleted){

      const actions =
        document.createElement("div");

      actions.className =
        "messageActions";


      const reaction =
        document.createElement("button");

      reaction.textContent =
        "☺ リアクション";

      reaction.onclick =
        () => showReactionPicker(
          row,
          data
        );


      const reply =
        document.createElement("button");

      reply.textContent =
        "↩︎ 返信";

      reply.onclick =
        () => setReply(data);


      actions.append(
        reaction,
        reply
      );


      if(data.uid === currentUID){

        const edit =
          document.createElement("button");

        edit.textContent = "編集";

        edit.onclick =
          () => editMessage(data);


        const del =
          document.createElement("button");

        del.textContent = "削除";

        del.onclick =
          () => removeMessage(data);


        actions.append(
          edit,
          del
        );

      }

      row.appendChild(actions);

    }


    list.appendChild(row);

  });

}


function buildReactionSummary(data){

  const reactions =
    data.reactions || {};

  let hasAny = false;

  const wrap =
    document.createElement("div");

  wrap.className =
    "reactionSummary";

  REACTIONS.forEach(emoji=>{

    const users =
      reactions[emoji] || [];

    if(users.length === 0){
      return;
    }

    hasAny = true;

    const chip =
      document.createElement("button");

    chip.className =
      "reactionChip";

    if(users.includes(currentUID)){
      chip.classList.add(
        "mineReaction"
      );
    }

    chip.textContent =
      `${emoji} ${users.length}`;

    chip.onclick =
      () => toggleReaction(
        data,
        emoji
      );

    wrap.appendChild(chip);

  });

  return hasAny
    ? wrap
    : null;
}


function showReactionPicker(row,data){

  document
    .querySelectorAll(".reactionPicker")
    .forEach(x=>x.remove());

  const picker =
    document.createElement("div");

  picker.className =
    "reactionPicker";

  REACTIONS.forEach(emoji=>{

    const button =
      document.createElement("button");

    button.textContent = emoji;

    button.onclick = async () => {

      await toggleReaction(
        data,
        emoji
      );

      picker.remove();

    };

    picker.appendChild(button);

  });

  row.appendChild(picker);

}


async function toggleReaction(data,emoji){

  const reactions =
    structuredClone(
      data.reactions || {}
    );

  /*
    1人1種類方式。
    Teamsっぽく別のリアクションへ
    切り替えられるようにする。
  */

  let sameReaction = false;

  REACTIONS.forEach(key=>{

    const users =
      reactions[key] || [];

    if(
      key === emoji &&
      users.includes(currentUID)
    ){
      sameReaction = true;
    }

    reactions[key] =
      users.filter(
        uid => uid !== currentUID
      );

  });

  if(!sameReaction){

    if(!reactions[emoji]){
      reactions[emoji] = [];
    }

    reactions[emoji].push(
      currentUID
    );

  }

  await updateDoc(
    doc(db,"messages",data.id),
    { reactions }
  );

}

async function sendMessage(){

  const text =
    $("messageInput")
    .value
    .trim();

  if(!text) return;


  if(editingMessage){

    await updateDoc(
      doc(
        db,
        "messages",
        editingMessage.id
      ),
      {
        text,
        edited:true,
        editedAt:serverTimestamp()
      }
    );

    editingMessage = null;

    $("editBar")
      .classList.add("hidden");

  }else{

    await addDoc(
      collection(
        db,
        "messages"
      ),
      {
        text,
        senderId:currentId,
        uid:currentUID,
        createdAt:serverTimestamp(),
        edited:false,
        deleted:false,
        reactions:{},

        replyTo:
          replyTarget
          ? {
              id:replyTarget.id,
              senderId:
                replyTarget.senderId,
              text:
                (replyTarget.text || "")
                .slice(0,150)
            }
          : null
      }
    );

  }

  $("messageInput").value = "";

  replyTarget = null;

  $("replyBar")
    .classList.add("hidden");

}

$("loadMore").onclick =
async () => {

  if(!oldestMessage){
    return;
  }

  const q = query(
    collection(db,"messages"),
    orderBy("createdAt","desc"),
    startAfter(oldestMessage),
    limit(50)
  );

  const snap =
    await getDocs(q);

  if(snap.empty){

    $("loadMore").textContent =
      "これより前のメッセージはありません";

    return;
  }

  snap.docs.forEach(d=>{

    messageDocs.set(
      d.id,
      {
        id:d.id,
        ...d.data()
      }
    );

  });

  oldestMessage =
    snap.docs[
      snap.docs.length - 1
    ];

  renderMessages();

};

async function markTalkRead(){

  if(!currentUID) return;

  const activeTab =
    document.querySelector(
      ".tab.active"
    );

  if(
    !activeTab ||
    activeTab.dataset.page !== "talkPage"
  ){
    return;
  }

  await setDoc(
    doc(
      db,
      "readStates",
      currentUID
    ),
    {
      uid:currentUID,
      senderId:currentId,
      lastReadAt:
        serverTimestamp()
    },
    {
      merge:true
    }
  );

}


function isReadByOther(message){

  if(!message.createdAt){
    return false;
  }

  return Object.values(
    readStates
  ).some(state=>{

    if(
      state.uid === currentUID
    ){
      return false;
    }

    if(
      !state.lastReadAt
    ){
      return false;
    }

    return (
      state.lastReadAt.seconds >=
      message.createdAt.seconds
    );

  });

}

$("locationSwitch").onclick =
async () => {

  if(
    locationWatch !== null
  ){

    navigator
      .geolocation
      .clearWatch(
        locationWatch
      );

    locationWatch = null;

    $("locationSwitch")
      .classList.remove("on");

    await setDoc(
      doc(
        db,
        "locations",
        currentUID
      ),
      {
        uid:currentUID,
        senderId:currentId,
        sharing:false,
        updatedAt:
          serverTimestamp()
      },
      {
        merge:true
      }
    );

    return;
  }


  if(
    !navigator.geolocation
  ){

    alert(
      "位置情報を利用できません"
    );

    return;
  }


  $("locationSwitch")
    .classList.add("on");


  locationWatch =
    navigator
    .geolocation
    .watchPosition(

      async position => {

        await setDoc(
          doc(
            db,
            "locations",
            currentUID
          ),
          {
            uid:currentUID,
            senderId:currentId,
            sharing:true,

            latitude:
              position.coords
              .latitude,

            longitude:
              position.coords
              .longitude,

            accuracy:
              position.coords
              .accuracy,

            updatedAt:
              serverTimestamp()
          },
          {
            merge:true
          }
        );

      },

      error => {

        console.error(error);

        alert(
          "位置情報を取得できませんでした"
        );

        $("locationSwitch")
          .classList.remove("on");

        locationWatch = null;

      },

      {
        enableHighAccuracy:true,
        maximumAge:15000,
        timeout:15000
      }

    );

};

            `${data.hostId || "誰か"} がルームを開いています`;

        $("openVoice")
          .classList.add("hidden");

        $("joinVoice")
          .classList.remove("hidden");

        $("muteVoice")
          .classList.add("hidden");

        $("leaveVoice")
          .classList.add("hidden");

      }
    );

}


function showVoiceClosed(){

  $("voiceStatus")
    .textContent =
      "ルームは開かれていません";

  $("openVoice")
    .classList.remove("hidden");

  $("joinVoice")
    .classList.add("hidden");

  $("muteVoice")
    .classList.add("hidden");

  $("leaveVoice")
    .classList.add("hidden");

}


function showVoiceJoined(){

  $("voiceStatus")
    .innerHTML =
      `<span class="voiceDot"></span><span class="voiceLive">ボイスルーム参加中</span>`;

  $("openVoice")
    .classList.add("hidden");

  $("joinVoice")
    .classList.add("hidden");

  $("muteVoice")
    .classList.remove("hidden");

  $("leaveVoice")
    .classList.remove("hidden");

}


async function prepareAudio(){

  localStream =
    await navigator
    .mediaDevices
    .getUserMedia({
      audio:true,
      video:false
    });

  peerConnection =
    new RTCPeerConnection(
      rtcConfig
    );


  localStream
    .getTracks()
    .forEach(track=>{

      peerConnection
        .addTrack(
          track,
          localStream
        );

    });


  peerConnection.ontrack =
    event=>{

      const remoteAudio =
        $("remoteAudio");

      remoteAudio.srcObject =
        event.streams[0];

      remoteAudio
        .play()
        .catch(
          ()=>{}
        );

    };

}


/* DELETE ICE COLLECTION */

async function clearCollection(
  name
){

  const snap =
    await getDocs(
      collection(
        db,
        "voiceRooms",
        "main",
        name
      )
    );

  const deletes =
    snap.docs.map(
      d=>deleteDoc(d.ref)
    );

  await Promise.all(
    deletes
  );

}


/* HOST */

$("openVoice").onclick =
async () => {

  try{

    await clearCollection(
      "callerCandidates"
    );

    await clearCollection(
      "calleeCandidates"
    );


    const currentRoom =
      await getDoc(
        voiceRoomRef
      );

    if(
      currentRoom.exists() &&
      currentRoom.data().active
    ){

      alert(
        "すでにルームが開かれています"
      );

      return;

    }


    await prepareAudio();

    voiceRole = "host";
    voiceJoined = true;

    showVoiceJoined();


    const callerCandidates =
      collection(
        db,
        "voiceRooms",
        "main",
        "callerCandidates"
      );


    peerConnection
      .onicecandidate =
      async event=>{

        if(event.candidate){

          await addDoc(
            callerCandidates,
            event.candidate
              .toJSON()
          );

        }

      };


    const offer =
      await peerConnection
      .createOffer();


    await peerConnection
      .setLocalDescription(
        offer
      );


    await setDoc(
      voiceRoomRef,
      {
        active:true,
        hostUID:currentUID,
        hostId:currentId,
        createdAt:
          serverTimestamp(),

        offer:{
          type:
            offer.type,
          sdp:
            offer.sdp
        },

        answer:null
      }
    );


    unsubscribeCalleeIce =
      onSnapshot(
        collection(
          db,
          "voiceRooms",
          "main",
          "calleeCandidates"
        ),
        snapshot=>{

          snapshot
          .docChanges()
          .forEach(change=>{

            if(
              change.type ===
              "added"
            ){

              const candidate =
                new RTCIceCandidate(
                  change.doc.data()
                );

              peerConnection
                ?.addIceCandidate(
                  candidate
                )
                .catch(
                  console.error
                );

            }

          });

        }
      );


    const answerUnsub =
      onSnapshot(
        voiceRoomRef,
        async snap=>{

          const data =
            snap.data();

          if(
            !peerConnection ||
            !data?.answer
          ){
            return;
          }

          if(
            !peerConnection
            .currentRemoteDescription
          ){

            await peerConnection
              .setRemoteDescription(
                new RTCSessionDescription(
                  data.answer
                )
              );

          }

        }
      );


    const oldLeave =
      $("leaveVoice").onclick;

    $("leaveVoice").onclick =
      async () => {

        answerUnsub();

        if(oldLeave){
          await oldLeave();
        }else{
          await leaveVoiceRoom(true);
        }

      };


  }catch(error){

    console.error(error);

    voiceJoined = false;

    closeLocalVoice();

    alert(
      "マイクを開始できませんでした。Safariのマイク許可を確認してください。"
    );

    showVoiceClosed();

  }

};


/* JOINER */

$("joinVoice").onclick =
async () => {

  try{

    const snap =
      await getDoc(
        voiceRoomRef
      );

    if(
      !snap.exists() ||
      !snap.data().active
    ){

      alert(
        "ルームは終了しています"
      );

      return;

    }

    const room =
      snap.data();

    if(!room.offer){

      alert(
        "接続情報を取得できません"
      );

      return;

    }


    await prepareAudio();

    voiceRole =
      "participant";

    voiceJoined =
      true;

    showVoiceJoined();


    const calleeCandidates =
      collection(
        db,
        "voiceRooms",
        "main",
        "calleeCandidates"
      );


    peerConnection
      .onicecandidate =
      async event=>{

        if(event.candidate){

          await addDoc(
            calleeCandidates,
            event.candidate
              .toJSON()
          );

        }

      };


    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          room.offer
        )
      );


    const answer =
      await peerConnection
      .createAnswer();


    await peerConnection
      .setLocalDescription(
        answer
      );


    await updateDoc(
      voiceRoomRef,
      {
        answer:{
          type:
            answer.type,
          sdp:
            answer.sdp
        },

        participantUID:
          currentUID,

        participantId:
          currentId
      }
    );


    unsubscribeCallerIce =
      onSnapshot(
        collection(
          db,
          "voiceRooms",
          "main",
          "callerCandidates"
        ),
        snapshot=>{

          snapshot
          .docChanges()
          .forEach(change=>{

            if(
              change.type ===
              "added"
            ){

              const candidate =
                new RTCIceCandidate(
                  change.doc.data()
                );

              peerConnection
                ?.addIceCandidate(
                  candidate
                )
                .catch(
                  console.error
                );

            }

          });

        }
      );


  }catch(error){

    console.error(error);

    voiceJoined = false;

    closeLocalVoice();

    alert(
      "ボイスルームに参加できませんでした。"
    );

  }

};


/* MUTE */

$("muteVoice").onclick =
() => {

  if(!localStream){
    return;
  }

  voiceMuted =
    !voiceMuted;

  localStream
    .getAudioTracks()
    .forEach(track=>{

      track.enabled =
        !voiceMuted;

    });

  $("muteVoice").textContent =
    voiceMuted
      ? "🔇 ミュート中"
      : "🎤 ミュート";

};


/* LEAVE */

$("leaveVoice").onclick =
async () => {

  await leaveVoiceRoom(true);

};


async function leaveVoiceRoom(
  updateFirestore = true
){

  if(!voiceJoined){
    return;
  }

  const wasHost =
    voiceRole === "host";

  closeLocalVoice();

  voiceJoined = false;
  voiceRole = null;
  voiceMuted = false;


  if(updateFirestore){

    try{

      if(wasHost){

        await setDoc(
          voiceRoomRef,
          {
            active:false,
            hostUID:null,
            hostId:null,
            participantUID:null,
            participantId:null,
            offer:null,
            answer:null,
            endedAt:
              serverTimestamp()
          },
          {
            merge:true
          }
        );

        await clearCollection(
          "callerCandidates"
        );

        await clearCollection(
          "calleeCandidates"
        );

      }else{

        await setDoc(
          voiceRoomRef,
          {
            participantUID:null,
            participantId:null,
            answer:null
          },
          {
            merge:true
          }
        );

        await clearCollection(
          "calleeCandidates"
        );

      }

    }catch(error){

      console.error(error);

    }

  }


  $("muteVoice")
    .textContent =
      "🎤 ミュート";

  const room =
    await getDoc(
      voiceRoomRef
    );

  if(
    room.exists() &&
    room.data().active
  ){

    $("voiceStatus")
      .textContent =
        `${room.data().hostId || "誰か"} がルームを開いています`;

    $("joinVoice")
      .classList.remove("hidden");

    $("openVoice")
      .classList.add("hidden");

    $("muteVoice")
      .classList.add("hidden");

    $("leaveVoice")
      .classList.add("hidden");

  }else{

    showVoiceClosed();

  }

}


function closeLocalVoice(){

  if(unsubscribeCallerIce){
    unsubscribeCallerIce();
    unsubscribeCallerIce = null;
  }

  if(unsubscribeCalleeIce){
    unsubscribeCalleeIce();
    unsubscribeCalleeIce = null;
  }

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

    localStream = null;

  }

  if(peerConnection){

    peerConnection.close();
    peerConnection = null;

  }

  $("remoteAudio")
    .srcObject = null;

}
