<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Private</title>
<style>
:root{
  --bg:#f3f3f3;--panel:#fff;--text:#222;--muted:#8a8a8a;--line:#e5e5e5;
  --dark:#111;--mine:#222;--blue:#2f6fed;--red:#e24a4a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* PIN */
#pinScreen{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#f7f7f7;padding:24px}
.pinBox{width:100%;max-width:360px;text-align:center}
.pinTitle{font-weight:600;font-size:17px;margin-bottom:28px}
.pinDots{display:flex;justify-content:center;gap:18px;margin-bottom:34px}
.pinDot{width:15px;height:15px;border:1.5px solid #555;border-radius:50%}
.pinDot.on{background:#222}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:15px 20px;justify-content:center}
.key{width:72px;height:72px;border:0;border-radius:50%;background:#e4e4e4;font-size:25px}
.key:active{background:#ccc}
.key.blank{visibility:hidden}
#pinError{height:22px;margin-top:18px;color:#999;font-size:13px}

/* LOGIN */
#loginScreen{min-height:100dvh;background:#111;display:flex;align-items:center;justify-content:center;padding:24px}
.loginCard{width:100%;max-width:420px;background:#fff;border-radius:25px;padding:34px 24px}
.logo{text-align:center;margin-bottom:30px}
.logo h1{margin:0;font-size:52px;letter-spacing:-3px}
.logo p{margin:4px 0;color:#777}
.field{margin:16px 0}
.field label{display:block;font-weight:600;margin-bottom:7px}
.field input,.field textarea{width:100%;padding:14px 15px;border:1px solid #ccc;border-radius:12px;font-size:16px}
.primary{width:100%;padding:15px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:700}
#loginError{min-height:20px;margin-top:12px;text-align:center;color:#c33}

/* APP */
#appScreen{height:100dvh;display:flex;flex-direction:column}
header{flex-shrink:0;background:#111;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 13px 9px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:30}
.brand{font-size:21px;font-weight:800}
.userLabel{font-size:10px;opacity:.68}
.headerRight{display:flex;align-items:center;gap:2px}
.headerIcon{border:0;background:none;color:#fff;font-size:23px;line-height:1;padding:7px 8px}
.headerMenu{position:absolute;right:10px;top:calc(48px + env(safe-area-inset-top));width:220px;background:#fff;color:#222;border-radius:14px;box-shadow:0 5px 24px rgba(0,0,0,.2);overflow:hidden;z-index:100}
.headerMenu button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:13px 15px;border-bottom:1px solid #eee}
.headerMenu button:last-child{border:0}
.tabs{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-bottom:1px solid #ddd}
.tab{padding:11px 2px 9px;border:0;background:#fff;font-weight:600;color:#888;font-size:13px}
.tab.active{color:#111;border-bottom:3px solid #111}
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* VOICE - only visible while room active/joined */
#voiceBar{flex-shrink:0;background:#f7fff9;border-bottom:1px solid #d9efdf;padding:7px 11px;font-size:12px}
.voiceBarInner{display:flex;align-items:center;justify-content:space-between;gap:8px}
.voiceInfo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voiceDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#1ca64c;margin-right:5px}
.voiceActions{display:flex;gap:5px;flex-shrink:0}
.voiceMini{border:0;border-radius:14px;padding:6px 10px;font-size:11px;font-weight:700;background:#111;color:#fff}
.voiceMini.sub{background:#e8e8e8;color:#222}
.voiceMini.danger{background:#eee;color:#a1001a}

/* TALK */
#talkPage{position:relative}
#messages{padding:8px 11px 6px}
#loadMore{display:block;margin:3px auto 12px;padding:7px 13px;border:0;border-radius:18px;background:#ddd;color:#555;font-size:11px}
.dateSeparator{display:flex;align-items:center;gap:9px;margin:14px 3px 10px;color:#999;font-size:10px}
.dateSeparator:before,.dateSeparator:after{content:"";flex:1;height:1px;background:#ddd}
.messageRow{display:flex;flex-direction:column;align-items:flex-start;margin:2px 0 3px}
.messageRow.mine{align-items:flex-end}
.messageRow.groupStart{margin-top:8px}
.sender{margin:0 7px 2px;font-size:10px;color:#888}
.bubbleLine{display:flex;align-items:center;gap:2px;max-width:90%}
.mine .bubbleLine{flex-direction:row-reverse}
.bubble{max-width:100%;background:#fff;padding:7px 10px;border-radius:15px;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.035);line-height:1.38}
.mine .bubble{background:#222;color:#fff}
.replyQuote{border-left:3px solid #aaa;padding:4px 7px;margin-bottom:5px;font-size:11px;opacity:.7}
.emojiBubble{background:transparent!important;box-shadow:none!important;padding:0 3px!important}
.emojiText.one{font-size:58px;line-height:1.1}
.emojiText.two{font-size:48px;line-height:1.1}
.emojiText.three{font-size:40px;line-height:1.1}
.messageMenuButton{border:0;background:none;color:#aaa;font-size:17px;line-height:1;padding:5px 3px}
.meta{display:flex;gap:5px;margin:1px 7px 0;font-size:9px;color:#999}
.reactionSummary{display:flex;flex-wrap:wrap;gap:3px;margin:2px 5px 0}
.reactionChip{border:1px solid #ddd;background:#fff;border-radius:12px;padding:2px 6px;font-size:11px}
.reactionChip.mineReaction{background:#f0f0f0;border-color:#aaa}
.messagePopup{display:flex;flex-direction:column;gap:6px;margin:3px 5px 5px;padding:7px 9px;background:#fff;border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.14);z-index:10}
.popupReactions{display:flex;gap:5px}
.popupReactions button{border:0;background:none;font-size:21px;padding:2px}
.popupActions{display:flex;gap:10px}
.popupActions button{border:0;background:none;color:#555;font-size:11px;padding:3px 0}

#newMessageButton{position:absolute;left:50%;bottom:calc(69px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;border:0;border-radius:20px;padding:8px 14px;background:#111;color:#fff;font-size:12px;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.2);white-space:nowrap}
#replyBar,#editBar{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:6px 11px;background:#eee;border-top:1px solid #ddd;font-size:11px}
#replyBar button,#editBar button{border:0;background:none;font-size:18px}
.composer{flex-shrink:0;display:flex;align-items:flex-end;gap:7px;padding:7px 9px calc(7px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd}
.composer textarea{flex:1;resize:none;min-height:40px;max-height:95px;border:1px solid #ccc;border-radius:19px;padding:9px 13px;font-size:16px}
.send{flex-shrink:0;width:41px;height:41px;border:0;border-radius:50%;background:#111;color:#fff;font-size:17px}

/* SOLO */
#soloList{padding:0 14px}
.post{background:#fff;margin:0 -14px;padding:14px;border-bottom:1px solid #eee}
.postHead{display:flex;justify-content:space-between}
.postUser{font-weight:700;font-size:14px}
.postTime{color:#999;font-size:10px}
.postText{white-space:pre-wrap;line-height:1.5;margin:8px 0}
.postFooter{display:flex;gap:10px}
.postFooter button{border:0;background:none;color:#777;padding:3px;font-size:12px}

/* CALENDAR */
.calendarToolbar{background:#fff;padding:10px 11px 8px;border-bottom:1px solid #ddd}
.calendarMonthRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.monthNav{width:38px;height:32px;border:0;background:#f2f2f2;border-radius:9px}
#calendarTitle{font-weight:800;font-size:17px}
.filters{display:flex;gap:6px}
.filterBtn{border:1px solid #ddd;background:#fff;border-radius:17px;padding:6px 11px;font-size:11px}
.filterBtn.active{background:#111;color:#fff;border-color:#111}
.calendar{background:#fff;padding:5px 6px 8px}
.weekdays,.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr)}
.weekday{text-align:center;font-size:10px;color:#888;padding:4px 0}
.dayCell{min-height:58px;border-top:1px solid #eee;border-left:1px solid #f2f2f2;padding:3px;overflow:hidden;background:#fff}
.dayCell:nth-child(7n+1){border-left:0}
.dayCell.otherMonth{background:#fafafa;color:#bbb}
.dayCell.selected{outline:2px solid #111;outline-offset:-2px}
.dayCell.today .dayNumber{background:#111;color:#fff}
.dayNumber{display:flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:50%;font-size:10px;margin-bottom:2px}
.eventBar{height:5px;border-radius:4px;margin:2px 0}
.eventMore{font-size:8px;color:#999}
.dayDetail{padding:11px}
.dayDetailHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#selectedDateTitle{font-weight:800}
.addEventBtn{border:0;background:#111;color:#fff;border-radius:16px;padding:7px 11px;font-size:11px}
.scheduleCard{background:#fff;border-radius:13px;padding:11px 12px;margin-bottom:8px;border-left:4px solid #888}
.scheduleTime{font-size:10px;color:#777}
.scheduleTitle{font-size:15px;font-weight:700;margin:4px 0}
.scheduleMemo{white-space:pre-wrap;font-size:12px;color:#555}
.scheduleOwner{font-size:10px;color:#999;margin-top:6px}
.scheduleActions button{border:0;background:none;color:#777;font-size:11px;padding:5px 7px 0 0}

/* SCHEDULE MODAL */
.modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal{width:100%;max-width:520px;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 12px}
.modal input,.modal textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin:5px 0}
.modal textarea{resize:none}
.modalBtns{display:flex;gap:8px;margin-top:8px}
.modalBtns button{flex:1;border:0;border-radius:10px;padding:11px}
.modalSave{background:#111;color:#fff;font-weight:700}

/* LOCATION */
.locationCard{margin:15px;padding:18px;background:#fff;border-radius:18px}
.locationTop{display:flex;justify-content:space-between;align-items:center}
.small{margin-top:5px;font-size:11px;color:#888}
.switch{position:relative;width:52px;height:31px;border:0;border-radius:20px;background:#ccc}
.switch:after{content:"";position:absolute;width:27px;height:27px;top:2px;left:2px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:#111}
.switch.on:after{left:23px}
.memberLocation{padding:13px 0;border-bottom:1px solid #eee}
.memberLocation:last-child{border:0}
.mapLink{display:inline-block;margin-top:6px;color:#1769aa;font-size:12px;text-decoration:none}

audio{display:none}
</style>
</head>
<body>

<section id="pinScreen">
  <div class="pinBox">
    <div class="pinTitle">PINを入力</div>
    <div class="pinDots">
      <div class="pinDot"></div><div class="pinDot"></div><div class="pinDot"></div><div class="pinDot"></div>
    </div>
    <div class="keypad">
      <button class="key">1</button><button class="key">2</button><button class="key">3</button>
      <button class="key">4</button><button class="key">5</button><button class="key">6</button>
      <button class="key">7</button><button class="key">8</button><button class="key">9</button>
      <button class="key blank"></button><button class="key">0</button><button class="key" id="backKey">⌫</button>
    </div>
    <div id="pinError"></div>
  </div>
</section>

<section id="loginScreen" class="hidden">
  <div class="loginCard">
    <div class="logo"><h1>PB</h1><p>Private Message</p></div>
    <div class="field"><label>ID</label><input id="loginId" autocomplete="username" autocapitalize="none"></div>
    <div class="field"><label>パスワード</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
    <button id="loginButton" class="primary">ログイン</button>
    <div id="loginError"></div>
  </div>
</section>

<section id="appScreen" class="hidden">
<header>
  <div>
    <div class="brand">PB</div>
    <div id="userLabel" class="userLabel"></div>
  </div>
  <div class="headerRight">
    <button id="headerMenuButton" class="headerIcon" aria-label="メニュー">⋯</button>
  </div>
  <div id="headerMenu" class="headerMenu hidden">
    <button id="menuVoice">🎙 ボイスルームを開く</button>
    <button id="menuSettings">⚙️ 設定</button>
    <button id="logoutButton">ログアウト</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-page="talkPage">トーク</button>
  <button class="tab" data-page="soloPage">ひとりごと</button>
  <button class="tab" data-page="schedulePage">予定</button>
  <button class="tab" data-page="locationPage">位置情報</button>
</nav>

<div id="talkPage" class="page">
  <div id="voiceBar" class="hidden">
    <div class="voiceBarInner">
      <div id="voiceInfo" class="voiceInfo"><span class="voiceDot"></span>ボイスルーム開催中</div>
      <div class="voiceActions">
        <button id="joinVoice" class="voiceMini">参加</button>
        <button id="muteVoice" class="voiceMini sub hidden">🎤</button>
        <button id="leaveVoice" class="voiceMini danger hidden">退出</button>
      </div>
    </div>
  </div>

  <div id="messages" class="scroll">
    <button id="loadMore">過去のトークを読み込む</button>
    <div id="messageList"></div>
  </div>

  <button id="newMessageButton" class="hidden">↓ 新着メッセージ</button>

  <div id="replyBar" class="hidden"><span id="replyText"></span><button id="cancelReply">×</button></div>
  <div id="editBar" class="hidden"><span>メッセージを編集中</span><button id="cancelEdit">×</button></div>

  <div class="composer">
    <textarea id="messageInput" rows="1" placeholder="メッセージ"></textarea>
    <button id="sendMessage" class="send">➤</button>
  </div>
</div>

<div id="soloPage" class="page hidden">
  <div id="soloList" class="scroll"></div>
  <div class="composer">
    <textarea id="soloInput" rows="1" placeholder="ひとりごと"></textarea>
    <button id="sendSolo" class="send">➤</button>
  </div>
</div>

<div id="schedulePage" class="page hidden">
  <div class="calendarToolbar">
    <div class="calendarMonthRow">
      <button id="prevMonth" class="monthNav">‹</button>
      <div id="calendarTitle"></div>
      <button id="nextMonth" class="monthNav">›</button>
    </div>
    <div class="filters">
      <button class="filterBtn active" data-filter="all">全員</button>
      <button class="filterBtn" data-filter="mine">自分</button>
      <button class="filterBtn" data-filter="others">相手</button>
    </div>
  </div>
  <div class="calendar">
    <div class="weekdays">
      <div class="weekday">日</div><div class="weekday">月</div><div class="weekday">火</div>
      <div class="weekday">水</div><div class="weekday">木</div><div class="weekday">金</div><div class="weekday">土</div>
    </div>
    <div id="calendarGrid" class="calendarGrid"></div>
  </div>
  <div id="dayDetail" class="scroll dayDetail">
    <div class="dayDetailHeader">
      <div id="selectedDateTitle"></div>
      <button id="openScheduleModal" class="addEventBtn">＋ 予定</button>
    </div>
    <div id="selectedDateEvents"></div>
  </div>
</div>

<div id="locationPage" class="page hidden">
  <div class="scroll">
    <div class="locationCard">
      <div class="locationTop">
        <div>
          <strong>現在地を共有</strong>
          <div class="small">ONの間だけ最新位置を共有します</div>
        </div>
        <button id="locationSwitch" class="switch"></button>
      </div>
    </div>
    <div class="locationCard">
      <strong>共有中のメンバー</strong>
      <div id="locations"></div>
    </div>
  </div>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>
</section>

<div id="scheduleModal" class="modalOverlay hidden">
  <div class="modal">
    <h3 id="scheduleModalTitle">予定を追加</h3>
    <input id="scheduleTitleInput" placeholder="予定のタイトル">
    <input id="scheduleDateInput" type="date">
    <input id="scheduleTimeInput" type="time">
    <textarea id="scheduleMemoInput" rows="3" placeholder="メモ（任意）"></textarea>
    <div class="modalBtns">
      <button id="cancelScheduleModal">キャンセル</button>
      <button id="saveSchedule" class="modalSave">保存</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {
  getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot,
  serverTimestamp, doc, updateDoc, deleteDoc, setDoc, getDoc, startAfter,
  getDocs, arrayUnion, arrayRemove, where, Timestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYEhnK2xJPYW457kgCme2KQJJEtJlowgk",
  authDomain: "message-57e2d.firebaseapp.com",
  projectId: "message-57e2d",
  storageBucket: "message-57e2d.firebasestorage.app",
  messagingSenderId: "560072908841",
  appId: "1:560072908841:web:a6d0e92a57a24c152a3c38"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let pin="", pinPassed=false, currentUID="", currentId="";
let replyTarget=null, editingMessage=null, oldestMessage=null;
let messageDocs=new Map(), previousNewestMessageId=null, firstMessageLoad=true;
let readStates={}, locationWatch=null;
let schedules=[], calendarDate=new Date(), selectedDate=new Date(), scheduleFilter="all", editingSchedule=null;
let unsubscribeMessages=null, unsubscribeReads=null, unsubscribeSolo=null, unsubscribeSchedules=null, unsubscribeLocations=null, unsubscribeVoice=null;
const REACTIONS=["👍","❤️","😂","😮","😢"];

/* PIN */
function updateDots(){ document.querySelectorAll(".pinDot").forEach((d,i)=>d.classList.toggle("on",i<pin.length)); }
document.querySelectorAll(".key").forEach(k=>{
  if(k.id==="backKey"||k.classList.contains("blank")) return;
  k.onclick=()=>{ if(pin.length>=4)return; pin+=k.textContent; updateDots(); if(pin.length===4)setTimeout(checkPin,120); };
});
$("backKey").onclick=()=>{pin=pin.slice(0,-1);updateDots()};
function checkPin(){
  if(pin==="0208"){window.location.replace("https://www.google.com/");return}
  if(pin==="0814"){
    pinPassed=true;$("pinScreen").classList.add("hidden");
    if(auth.currentUser)showApp(auth.currentUser);else $("loginScreen").classList.remove("hidden");
    return;
  }
  $("pinError").textContent="PINが違います";pin="";updateDots();
  setTimeout(()=>$("pinError").textContent="",1000);
}

/* LOGIN */
$("loginButton").onclick=async()=>{
  const id=$("loginId").value.trim().toLowerCase(), pw=$("loginPassword").value;
  if(!id||!pw)return;
  try{$("loginError").textContent="";await signInWithEmailAndPassword(auth,`${id}@pb.local`,pw)}
  catch(e){console.error(e);$("loginError").textContent="IDまたはパスワードが違います"}
};
$("loginPassword").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginButton").click()});
$("logoutButton").onclick=async()=>{await leaveVoiceRoom(false);await signOut(auth);$("appScreen").classList.add("hidden");$("loginScreen").classList.remove("hidden")};
onAuthStateChanged(auth,user=>{
  if(user&&pinPassed)showApp(user);
  if(!user&&pinPassed){$("appScreen").classList.add("hidden");$("loginScreen").classList.remove("hidden")}
});
function showApp(user){
  currentUID=user.uid;currentId=(user.email||"").replace("@pb.local","");
  $("userLabel").textContent=`ID：${currentId}`;
  $("loginScreen").classList.add("hidden");$("appScreen").classList.remove("hidden");
  listenMessages();listenReadStates();listenSolo();listenSchedules();listenLocations();listenVoiceRoom();
}

/* HEADER MENU */
$("headerMenuButton").onclick=e=>{e.stopPropagation();$("headerMenu").classList.toggle("hidden")};
document.addEventListener("click",e=>{if(!$("headerMenu").contains(e.target)&&e.target!==$("headerMenuButton"))$("headerMenu").classList.add("hidden")});
$("menuVoice").onclick=async()=>{$("headerMenu").classList.add("hidden");await openVoiceRoom()};
$("menuSettings").onclick=()=>{$("headerMenu").classList.add("hidden");alert("通知・バッジ・プロフィール設定は Ver.3.2 で追加予定です。")};

/* TABS */
document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));tab.classList.add("active");
    ["talkPage","soloPage","schedulePage","locationPage"].forEach(p=>$(p).classList.add("hidden"));
    $(tab.dataset.page).classList.remove("hidden");
    if(tab.dataset.page==="talkPage"){
      requestAnimationFrame(()=>{
        if(firstMessageLoad)scrollToLatest(false);
        else if(isNearBottom())markTalkRead();
      });
    }
  };
});
function activePage(){return document.querySelector(".tab.active")?.dataset.page}

/* EMOJI */
function getEmojiCount(text){
  const cleaned=text.replace(/\s/g,"").replace(/\uFE0F/g,"");
  if(!cleaned)return 0;
  const re=/(?:\p{Extended_Pictographic}(?:\uFE0F|\uFE0E)?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|\uFE0E)?)?|\p{Regional_Indicator}{2})/gu;
  const m=cleaned.match(re);if(!m)return 0;
  return m.join("").replace(/\uFE0F/g,"")===cleaned?m.length:0;
}

/* MESSAGE REALTIME */
function listenMessages(){
  if(unsubscribeMessages)unsubscribeMessages();
  const q=query(collection(db,"messages"),orderBy("createdAt","desc"),limit(50));
  unsubscribeMessages=onSnapshot(q,snapshot=>{
    const wasNearBottom=isNearBottom();
    const newest=snapshot.docs[0]||null, newestId=newest?.id||null, newestData=newest?.data()||null;
    const hasNew=previousNewestMessageId!==null&&newestId!==previousNewestMessageId;
    const newMine=newestData?.uid===currentUID;

    /* Keep older pages already loaded; refresh current 50 */
    snapshot.docs.forEach(d=>messageDocs.set(d.id,{id:d.id,...d.data()}));
    oldestMessage=snapshot.docs[snapshot.docs.length-1]||oldestMessage;
    renderMessages();

    if(firstMessageLoad){
      firstMessageLoad=false;scrollToLatest(false);
    }else if(hasNew&&newMine){
      scrollToLatest(true);
    }else if(hasNew&&wasNearBottom){
      scrollToLatest(true);
    }else if(hasNew&&!wasNearBottom){
      $("newMessageButton").classList.remove("hidden");
    }
    previousNewestMessageId=newestId;
  });
}

function formatDay(ts){
  const d=ts?.toDate?ts.toDate():null;if(!d)return "";
  const today=new Date(), y=new Date(today);y.setDate(today.getDate()-1);
  const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  if(same(d,today))return "今日";
  if(same(d,y))return "昨日";
  return d.toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"});
}
function dayKey(ts){
  if(!ts?.toDate)return "";
  const d=ts.toDate();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function renderMessages(){
  const list=$("messageList");list.innerHTML="";
  const items=[...messageDocs.values()].sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
  let prev=null, prevDay="";
  items.forEach(data=>{
    const dk=dayKey(data.createdAt);
    if(dk&&dk!==prevDay){
      const sep=document.createElement("div");sep.className="dateSeparator";sep.textContent=formatDay(data.createdAt);list.appendChild(sep);prevDay=dk;
    }
    const sameSender=prev&&prev.uid===data.uid&&prevDay===dk&&Math.abs((data.createdAt?.seconds||0)-(prev.createdAt?.seconds||0))<=300;
    const row=document.createElement("div");row.className="messageRow"+(data.uid===currentUID?" mine":"")+(!sameSender?" groupStart":"");
    if(!sameSender){
      const sender=document.createElement("div");sender.className="sender";sender.textContent=data.uid===currentUID?"自分":data.senderId;row.appendChild(sender);
    }
    const line=document.createElement("div");line.className="bubbleLine";
    const bubble=document.createElement("div");bubble.className="bubble";
    if(data.replyTo?.text){
      const quote=document.createElement("div");quote.className="replyQuote";quote.textContent=`${data.replyTo.senderId}：${data.replyTo.text}`;bubble.appendChild(quote);
    }
    const body=document.createElement("div");body.textContent=data.text||"";
    const ec=getEmojiCount(data.text||"");
    if(ec>=1&&ec<=3){bubble.classList.add("emojiBubble");body.className=`emojiText ${ec===1?"one":ec===2?"two":"three"}`}
    bubble.appendChild(body);
    const menu=document.createElement("button");menu.className="messageMenuButton";menu.textContent="⋯";menu.onclick=e=>{e.stopPropagation();toggleMessagePopup(row,data)};
    line.append(bubble,menu);row.appendChild(line);

    const reactions=buildReactionSummary(data);if(reactions)row.appendChild(reactions);

    const meta=document.createElement("div");meta.className="meta";
    if(data.createdAt?.toDate){
      const t=document.createElement("span");t.textContent=data.createdAt.toDate().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});meta.appendChild(t);
    }
    if(data.edited){const e=document.createElement("span");e.textContent="編集済み";meta.appendChild(e)}
    if(data.uid===currentUID&&isReadByOther(data)){const r=document.createElement("span");r.textContent="既読";meta.appendChild(r)}
    row.appendChild(meta);list.appendChild(row);prev=data;
  });
}
function toggleMessagePopup(row,data){
  document.querySelectorAll(".messagePopup").forEach(p=>{if(p.parentElement!==row)p.remove()});
  const old=row.querySelector(".messagePopup");if(old){old.remove();return}
  const pop=document.createElement("div");pop.className="messagePopup";
  const pr=document.createElement("div");pr.className="popupReactions";
  REACTIONS.forEach(em=>{const b=document.createElement("button");b.textContent=em;b.onclick=async()=>{await toggleReaction(data,em);pop.remove()};pr.appendChild(b)});
  const pa=document.createElement("div");pa.className="popupActions";
  const rep=document.createElement("button");rep.textContent="返信";rep.onclick=()=>{setReply(data);pop.remove()};pa.appendChild(rep);
  if(data.uid===currentUID){
    const edit=document.createElement("button");edit.textContent="編集";edit.onclick=()=>{editMessage(data);pop.remove()};
    const del=document.createElement("button");del.textContent="削除";del.onclick=async()=>{pop.remove();await removeMessageCompletely(data)};
    pa.append(edit,del);
  }

}
function buildReactionSummary(data){
  const reactions=data.reactions||{};let any=false;
  const w=document.createElement("div");w.className="reactionSummary";
  REACTIONS.forEach(em=>{
    const users=reactions[em]||[];if(!users.length)return;any=true;
    const c=document.createElement("button");c.className="reactionChip"+(users.includes(currentUID)?" mineReaction":"");c.textContent=`${em}${users.length>1?users.length:""}`;c.onclick=()=>toggleReaction(data,em);w.appendChild(c);
  });
  return any?w:null;
}
async function toggleReaction(data,emoji){
  const reactions=JSON.parse(JSON.stringify(data.reactions||{}));let same=false;

/* Complete delete: delete message + clear copied quote from currently matching replies */
async function removeMessageCompletely(data){
  if(!confirm("このメッセージを完全に削除しますか？"))return;
  try{
    const repliesQ=query(collection(db,"messages"),where("replyTo.id","==",data.id));
    const replies=await getDocs(repliesQ);
    await Promise.all(replies.docs.map(d=>updateDoc(d.ref,{replyTo:null})));
  }catch(e){
    console.warn("引用解除クエリ:",e);
  }
  await deleteDoc(doc(db,"messages",data.id));
  messageDocs.delete(data.id);renderMessages();
}

const voiceRoomRef=doc(db,"voiceRooms","main");

const rtcConfig={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function clearCollection(name){
  const snap=await getDocs(collection(db,"voiceRooms","main",name));await Promise.all(snap.docs.map(d=>deleteDoc(d.ref)));
}
async function prepareAudio(){
  localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
  peerConnection=new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));
  peerConnection.ontrack=e=>{const a=$("remoteAudio");a.srcObject=e.streams[0];a.play().catch(()=>{})};
}
async function openVoiceRoom(){
  try{
    const cur=await getDoc(voiceRoomRef);if(cur.exists()&&cur.data().active){alert("すでにルームが開かれています");return}
    await clearCollection("callerCandidates");await clearCollection("calleeCandidates");await prepareAudio();
    voiceRole="host";voiceJoined=true;$("voiceBar").classList.remove("hidden");
    peerConnection.onicecandidate=async e=>{if(e.candidate)await addDoc(collection(db,"voiceRooms","main","callerCandidates"),e.candidate.toJSON())};
    const offer=await peerConnection.createOffer();await peerConnection.setLocalDescription(offer);
    await setDoc(voiceRoomRef,{active:true,hostUID:currentUID,hostId:currentId,createdAt:serverTimestamp(),offer:{type:offer.type,sdp:offer.sdp},answer:null});
    unsubscribeCalleeIce=onSnapshot(collection(db,"voiceRooms","main","calleeCandidates"),s=>s.docChanges().forEach(c=>{if(c.type==="added")peerConnection?.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(console.error)}));
    answerListener=onSnapshot(voiceRoomRef,async s=>{const d=s.data();if(peerConnection&&d?.answer&&!peerConnection.currentRemoteDescription)await peerConnection.setRemoteDescription(new RTCSessionDescription(d.answer))});
  }catch(e){console.error(e);closeLocalVoice();voiceJoined=false;alert("マイクを開始できませんでした。マイク許可を確認してください。")}
}
$("joinVoice").onclick=async()=>{
  try{
    const snap=await getDoc(voiceRoomRef);if(!snap.exists()||!snap.data().active){alert("ルームは終了しています");return}
    const room=snap.data();await prepareAudio();voiceRole="participant";voiceJoined=true;
    peerConnection.onicecandidate=async e=>{if(e.candidate)await addDoc(collection(db,"voiceRooms","main","calleeCandidates"),e.candidate.toJSON())};
    await peerConnection.setRemoteDescription(new RTCSessionDescription(room.offer));
    const answer=await peerConnection.createAnswer();await peerConnection.setLocalDescription(answer);
    await updateDoc(voiceRoomRef,{answer:{type:answer.type,sdp:answer.sdp},participantUID:currentUID,participantId:currentId});
    unsubscribeCallerIce=onSnapshot(collection(db,"voiceRooms","main","callerCandidates"),s=>s.docChanges().forEach(c=>{if(c.type==="added")peerConnection?.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(console.error)}));
  }catch(e){console.error(e);closeLocalVoice();voiceJoined=false;alert("ボイスルームに参加できませんでした。")}
};
$("muteVoice").onclick=()=>{
  if(!localStream)return;voiceMuted=!voiceMuted;localStream.getAudioTracks().forEach(t=>t.enabled=!voiceMuted);$("muteVoice").textContent=voiceMuted?"🔇":"🎤";
};
$("leaveVoice").onclick=()=>leaveVoiceRoom(true);
async function leaveVoiceRoom(updateFirestore=true){
  if(!voiceJoined)return;const host=voiceRole==="host";closeLocalVoice();voiceJoined=false;voiceRole=null;voiceMuted=false;$("muteVoice").textContent="🎤";
  if(updateFirestore){
    if(host){
      await setDoc(voiceRoomRef,{active:false,hostUID:null,hostId:null,participantUID:null,participantId:null,offer:null,answer:null,endedAt:serverTimestamp()},{merge:true});
      await clearCollection("callerCandidates");await clearCollection("calleeCandidates");
    }else{
      await setDoc(voiceRoomRef,{participantUID:null,participantId:null,answer:null},{merge:true});await clearCollection("calleeCandidates");
    }
  }
  const r=await getDoc(voiceRoomRef);if(!r.exists()||!r.data().active)$("voiceBar").classList.add("hidden");
}
function closeLocalVoice(){
  if(unsubscribeCallerIce){unsubscribeCallerIce();unsubscribeCallerIce=null}
  if(unsubscribeCalleeIce){unsubscribeCalleeIce();unsubscribeCalleeIce=null}
  if(answerListener){answerListener();answerListener=null}
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
  if(peerConnection){peerConnection.close();peerConnection=null}
  $("remoteAudio").srcObject=null;
}

/* Initial calendar */
calendarDate=new Date();selectedDate=new Date();renderCalendar();renderSelectedDay();
</script>
