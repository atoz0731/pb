<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><title>PB 通知設定（テスト）</title><style>body{font-family:-apple-system,Arial,sans-serif;max-width:500px;margin:30px auto;padding:18px;color:#111}button,input{font-size:17px;padding:12px;margin:5px 0;width:100%;box-sizing:border-box}button{background:#111;color:#fff;border:0;border-radius:12px}button:disabled{background:#aaa}.status{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:12px;font-size:14px}h1{font-size:22px}p{font-size:13px;color:#666}</style></head><body><h1>通知の設定（テスト版）</h1><p>この端末ごとに通知をON/OFFできます。通知本文や送信者名は表示しません。iPhoneはPBをホーム画面に追加し、そこから開いてください。</p><div id="login"><input id="id" placeholder="PB ID" autocomplete="username"><input id="password" type="password" placeholder="パスワード" autocomplete="current-password"><button id="signIn">ログイン</button></div><div id="controls" hidden><button id="enable">この端末の通知をON</button><button id="test">自分の登録端末へテスト通知</button><button id="disable">この端末の通知をOFF</button></div><div id="status" class="status">認証を確認中…</div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
const config={apiKey:'AIzaSyBYEhnK2xJPYW457kgCme2KQJJEtJlowgk',authDomain:'message-57e2d.firebaseapp.com',projectId:'message-57e2d',storageBucket:'message-57e2d.firebasestorage.app',messagingSenderId:'560072908841',appId:'1:560072908841:web:a6d0e92a57a24c152a3c38'};
const auth=getAuth(initializeApp(config)), $=id=>document.getElementById(id);
const base='https://pb-push.hnkyushu.workers.dev';
function say(message){$('status').textContent=message}
async function api(path,method='GET',data){const user=auth.currentUser;if(!user)throw Error('PBにログインしてください');const token=await user.getIdToken();const res=await fetch(base+path,{method,headers:{Authorization:'Bearer '+token,...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined});const result=await res.json();if(!res.ok)throw Error(result.error||'通信失敗 '+res.status);return result}
function bytes64(s){const pad='='.repeat((4-s.length%4)%4);const raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
async function registration(){if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('この環境はWeb Push非対応です。iPhoneはホーム画面から起動してください。');await navigator.serviceWorker.register('./pb-push-sw.js',{scope:'./'});return navigator.serviceWorker.ready}
$('signIn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('id').value.trim()+'@pb.local',$('password').value);$('password').value=''}catch{say('ログインできませんでした')}};
onAuthStateChanged(auth,user=>{$('login').hidden=!!user;$('controls').hidden=!user;say(user?'ログイン済み。通知設定を選んでください。':'PBアカウントでログインしてください。')});
$('enable').onclick=async()=>{try{say('通知の準備中…');const reg=await registration();if(Notification.permission==='denied')throw Error('iPhoneの設定で通知が拒否されています');const permission=await Notification.requestPermission();if(permission!=='granted')throw Error('通知が許可されませんでした');const {publicKey}=await api('/api/public-key');if(!publicKey)throw Error('WorkerのVAPID公開鍵が未設定です');let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes64(publicKey)});await api('/api/subscription','POST',sub.toJSON());say('この端末の通知をONにしました。')}catch(e){say('設定失敗: '+e.message)}};
$('disable').onclick=async()=>{try{const reg=await registration(),sub=await reg.pushManager.getSubscription();if(sub){await api('/api/subscription','DELETE',{endpoint:sub.endpoint});await sub.unsubscribe()}say('この端末の通知をOFFにしました。')}catch(e){say('解除失敗: '+e.message)}};
$('test').onclick=async()=>{try{const result=await api('/api/test','POST');say('テスト送信処理: 成功 '+result.sent+'件 / 失敗 '+result.failed+'件。通知が表示されるか確認してください。')}catch(e){say('テスト失敗: '+e.message)}};
</script></body></html>
